# StampFly Protocol - Message Definitions
# Version: 1.0.0
# Last Updated: 2026-09-12 (documented flags bit 4 POS_MODE, already implemented in espnow_protocol.hpp)

version: "1.0.0"

# =============================================================================
# Common Types
# =============================================================================
types:
  mac_address:
    description: "MAC address (lower 3 bytes used for addressing)"
    base: bytes
    size: 3

  normalized_value:
    description: "Normalized control value"
    base: uint16
    range: [0, 1000]
    center: 500

  checksum_sum:
    description: "Simple sum checksum (sum of preceding bytes)"
    base: uint8

  checksum_xor:
    description: "XOR checksum (XOR of preceding bytes)"
    base: uint8

# =============================================================================
# Control Packet (Controller -> Vehicle)
# =============================================================================
messages:
  ControlPacket:
    description: "Control commands from controller to vehicle"
    size: 14
    transport: espnow
    rate_hz: 50
    fields:
      - name: drone_mac
        type: mac_address
        offset: 0
        description: "Destination drone MAC (lower 3 bytes)"

      # On-air values are 12-bit ADC counts (0..4095), spring-centred at ~2048.
      # The legacy "0..1000 / 500=center" text was stale; the real controller
      # (firmware/controller, Throttle = 4095 - stick) and the proven vehicle
      # firmware both use 2048-centred 12-bit. uint16, little-endian.
      # on-air は 12bit ADC カウント(0..4095)、スプリング中央 ~2048。旧 "0..1000/500"
      # 表記は古い。実コントローラと実証済みファームは 2048 中央の 12bit を使う。
      - name: throttle
        type: uint16
        offset: 3
        description: "Throttle, 12-bit ADC (2048=zero, 4095=max; spring-centred)"

      - name: roll
        type: uint16
        offset: 5
        description: "Roll, 12-bit ADC (2048=center, <2048=left, >2048=right)"

      - name: pitch
        type: uint16
        offset: 7
        description: "Pitch, 12-bit ADC (2048=center, <2048=forward, >2048=backward)"

      - name: yaw
        type: uint16
        offset: 9
        description: "Yaw, 12-bit ADC (2048=center, <2048=CCW, >2048=CW)"

      - name: flags
        type: uint8
        offset: 11
        description: "Control flags bitfield"
        bits:
          - name: ARM
            bit: 0
            description: "Arm/disarm motors"
          - name: FLIP
            bit: 1
            description: "Trigger flip maneuver"
          - name: MODE
            bit: 2
            description: "Flight mode toggle"
          - name: ALT_MODE
            bit: 3
            description: "Altitude hold mode"
          - name: POS_MODE
            bit: 4
            description: "Position hold mode (POS_HOLD)"

      - name: reserved
        type: uint8
        offset: 12
        description: "Reserved for future use"

      - name: checksum
        type: checksum_sum
        offset: 13
        description: "Sum of bytes 0-12"

# =============================================================================
# Telemetry Packet (Vehicle -> Controller via ESP-NOW)
# =============================================================================
  TelemetryPacket:
    description: "Basic telemetry via ESP-NOW"
    size: 22
    transport: espnow
    rate_hz: 50
    fields:
      - name: header
        type: uint8
        offset: 0
        value: 0xAA
        description: "Packet header marker"

      - name: packet_type
        type: uint8
        offset: 1
        value: 0x01
        description: "Packet type (0x01 = basic telemetry)"

      - name: sequence
        type: uint8
        offset: 2
        description: "Sequence number (wraps at 255)"

      - name: battery_mv
        type: uint16
        offset: 3
        unit: mV
        description: "Battery voltage in millivolts"

      - name: altitude_cm
        type: int16
        offset: 5
        unit: cm
        description: "Altitude in centimeters"

      - name: velocity_x
        type: int16
        offset: 7
        unit: mm/s
        description: "X velocity (body frame)"

      - name: velocity_y
        type: int16
        offset: 9
        unit: mm/s
        description: "Y velocity (body frame)"

      - name: velocity_z
        type: int16
        offset: 11
        unit: mm/s
        description: "Z velocity (body frame, positive down)"

      - name: roll_deg10
        type: int16
        offset: 13
        unit: 0.1deg
        description: "Roll angle (1/10 degree resolution)"

      - name: pitch_deg10
        type: int16
        offset: 15
        unit: 0.1deg
        description: "Pitch angle (1/10 degree resolution)"

      - name: yaw_deg10
        type: int16
        offset: 17
        unit: 0.1deg
        description: "Yaw angle (1/10 degree resolution)"

      - name: state
        type: uint8
        offset: 19
        description: "Flight state enum"
        enum:
          - name: INIT
            value: 0
          - name: IDLE
            value: 1
          - name: ARMED
            value: 2
          - name: FLYING
            value: 3
          - name: LANDING
            value: 4
          - name: ERROR
            value: 5

      - name: flags
        type: uint8
        offset: 20
        description: "Warning flags"
        bits:
          - name: LOW_BATTERY
            bit: 0
          - name: SENSOR_ERROR
            bit: 1
          - name: COMM_LOST
            bit: 2
          - name: CALIBRATING
            bit: 3

      - name: checksum
        type: checksum_sum
        offset: 21
        description: "Sum of bytes 0-20"

# =============================================================================
# Pairing Packet
# =============================================================================
  PairingPacket:
    description: "Pairing request/response"
    size: 11
    transport: espnow
    fields:
      - name: channel
        type: uint8
        offset: 0
        description: "WiFi channel (1-13)"

      - name: drone_mac
        type: bytes
        size: 6
        offset: 1
        description: "Drone MAC address"

      - name: signature
        type: bytes
        size: 4
        offset: 7
        value: [0xAA, 0x55, 0x16, 0x88]
        description: "Pairing signature"

# =============================================================================
# TDMA Beacon
# =============================================================================
  TDMABeacon:
    description: "TDMA synchronization beacon"
    size: 2
    transport: espnow
    fields:
      - name: marker
        type: bytes
        size: 2
        offset: 0
        value: [0xBE, 0xAC]
        description: "Beacon marker"
