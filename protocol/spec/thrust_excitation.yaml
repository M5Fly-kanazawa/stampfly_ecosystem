# thrust_excitation.yaml - waveform table of the vertical thrust excitation (SSOT)
# thrust_excitation.yaml - 鉛直の推力励振の波形表（基準ファイル）
#
# The firmware (firmware/vehicle/components/sf_core/include/thrust_excitation_table.hpp) and the
# PC analysis (tools/sysid/thrust_excitation_table.py) both take the multisine frequencies, phases,
# normalisation and ramp lengths from here, so the signal that the PC regenerates is the signal
# the craft flew. Both files are generated by protocol/tools/gen_thrust_excitation.py
# (--check fails when they are stale). Do not edit them by hand.
# ファーム側と PC 側の解析は、多重正弦波の周波数・位相・正規化・立ち上げの長さをここから取る。
# PC が再生成する信号は機体が飛んだ信号と同じになる。生成物は
# protocol/tools/gen_thrust_excitation.py が出す（--check で鮮度を検査）。手で編集しないこと。
#
# Design: firmware/vehicle/docs/detailed_design.md, section "thrust excitation".
# 設計: firmware/vehicle/docs/detailed_design.md の「推力励振」節。

version: 1

# The control loop runs at a fixed 400 Hz; the waveform advances one table step per control cycle.
# 制御ループは 400 Hz 固定。波形は制御周期ごとに 1 歩進む。
sample_rate_hz: 400

# All tones are integer multiples of 0.1 Hz, so the multisine repeats every period_cycles samples
# (400 Hz x 10 s). The phase of tone i at cycle k is 2*pi*(frequency_index*k + phase_index)/period_cycles.
# 全ての音は 0.1 Hz の整数倍なので、多重正弦波は period_cycles 標本（400 Hz × 10 s）で繰り返す。
# 音 i の周期 k での位相は 2*pi*(frequency_index*k + phase_index)/period_cycles。
period_cycles: 4000

# Multisine: 8 tones with equal amplitude. frequency_index is in units of 0.1 Hz
# (4, 7, 11, 17, 27, 41, 59, 89 are pairwise not multiples of each other, so no tone is a harmonic of
# another). phase_index (units of 1/period_cycles turn) was chosen by a numerical search that minimises
# the crest factor (peak / RMS) of the sum over one period: 2.32 (random phases give about 3.2).
# 多重正弦波: 振幅の等しい 8 本。frequency_index は 0.1 Hz 単位（互いに他の倍数にならない整数を選び、
# どの音も他の音の高調波にならない）。phase_index（1/period_cycles 回転単位）は、1 周期の合計の
# クレストファクタ（ピーク ÷ 実効値）を最小にする数値探索で選んだ: 2.32（乱数位相では約 3.2）。
multisine:
  tones:
    - {frequency_index: 4,  phase_index: 0}
    - {frequency_index: 7,  phase_index: 3704}
    - {frequency_index: 11, phase_index: 2289}
    - {frequency_index: 17, phase_index: 2456}
    - {frequency_index: 27, phase_index: 3664}
    - {frequency_index: 41, phase_index: 3593}
    - {frequency_index: 59, phase_index: 1852}
    - {frequency_index: 89, phase_index: 1048}
  # Half-cosine ramps at the start and the end, inside the nominal length. [s]
  # 始めと終わりの半余弦の立ち上げ・立ち下げ（公称の長さの内側）。[s]
  ramp_up_s: 0.5
  ramp_down_s: 0.5

# Steps: positive and negative levels alternate, one half period each. A short ramp-up at the start,
# true steps inside, and a ramp-down that is added AFTER the nominal length. [s]
# 階段: 正負の段を半周期ずつ交互に。始めは短い立ち上げ、内側は本当の段、終わりの立ち下げは公称の長さの「後」に足す。[s]
steps:
  ramp_up_s: 0.1
  ramp_down_s: 0.25

# Abort: a running excitation returns to 0 with a half-cosine of this length. [s]
# 打ち切り: 実行中の励振は、この長さの半余弦で 0 に戻る。[s]
abort_ramp_s: 0.25
