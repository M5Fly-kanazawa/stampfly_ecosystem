# StampFly Flight Log Format - Single Source of Truth
# StampFly フライトログ形式 - 正本（Single Source of Truth）
#
# This file is the ONLY place where the "StampFly flight log bundle" (v1)
# format is defined. `protocol/tools/gen_flight_log.py` generates
# `lib/sflog/schema.py` and `docs/reference/flight-log-format.md` from this
# file -- do not hand-edit either generated file.
# このファイルが「StampFly フライトログ一式」（v1）形式を定義する唯一の場所。
# `protocol/tools/gen_flight_log.py` がこのファイルから
# `lib/sflog/schema.py` と `docs/reference/flight-log-format.md` を生成する --
# どちらの生成物も手で編集しないこと。
#
# Decision document / 決定文書: docs/plans/flight-log-format-plan.md (section 2)

format: stampfly-flight-log
version: 1

# =============================================================================
# Container (plan section 2.1)
# 容器（計画書 2.1節）
# =============================================================================
container:
  type: zip
  compression: deflate
  extension: ".sflog.zip"
  # Flat layout: no subfolders inside the zip / 平坦: zip 内にサブフォルダなし。
  layout: flat
  members:
    - meta.json
    - schema.json
    - "<stream>.csv"
  # Readers accept a plain directory with the same flat layout as an
  # alternative to the zip file (useful while a capture is in progress, or
  # for manual inspection). Unknown files (e.g. SILS's results.json) are
  # ignored by readers, not rejected.
  # 読み込み側は、zip の代わりに同じ平坦レイアウトの展開済みフォルダも
  # 受け付ける（取得中の途中確認や手作業での閲覧に便利）。未知のファイル
  # （SILS の results.json 等）は読み込み側が無視する（拒否しない）。
  accepts_directory: true
  unknown_files: ignored

# =============================================================================
# File naming (plan section 2.1)
# ファイル命名規則（計画書 2.1節）
# =============================================================================
file_naming:
  # <日時> = PC 取得開始時刻 / <日時> = PC capture start time (local time).
  vehicle: "flight_<YYYYMMDD>T<HHMMSS>.sflog.zip"
  sils: "sils_<scenario>_<YYYYMMDD>T<HHMMSS>.sflog.zip"
  sim: "sim_<backend>_<YYYYMMDD>T<HHMMSS>.sflog.zip"

# =============================================================================
# Required streams per capture source (plan section 2.2: a bundle simply
# omits the streams it has no packets for; which streams can never be
# missing depends on where the bundle came from)
# 取得元ごとの必須ストリーム（計画書 2.2節: パケットが無いストリームの
# ファイルは作らない。「絶対に欠けないストリーム」は取得元で決まる）
# =============================================================================
required_streams:
  # The vehicle's Data Stream always carries the 400 Hz IMU+ESKF packet.
  # 実機の Data Stream は 400 Hz の IMU+ESKF パケットを必ず送る。
  vehicle: [imu]
  # The SILS emulator runs the real IMU task (imu) on top of MuJoCo (truth).
  # SILS エミュレータは MuJoCo（truth）の上で実ファームの IMU タスク（imu）を回す。
  sils: [imu, truth]
  # Pure-physics simulators (vpython/genesis) run no firmware: only truth.
  # 純粋な物理シミュレータ（vpython/genesis）はファームを持たない: truth のみ。
  sim: [truth]
  # A bundle whose meta.json names any other (or no) source is checked
  # against the `vehicle` list.
  # meta.json の source がそれ以外（または無い）一式は `vehicle` の一覧で検査する。

# =============================================================================
# CSV rules (plan section 2.1)
# CSV の規則（計画書 2.1節）
# =============================================================================
csv_rules:
  encoding: utf-8
  header_row: true
  comment_rows: false
  first_column: timestamp_us
  first_column_type: int
  # 32-bit float has ~7 significant decimal digits; %.7g keeps that precision
  # without wasting bytes on digits the sensor never had.
  # 32bit float の有効桁は約7桁。%.7g はその精度を保ちつつ、センサに
  # 存在しない桁でファイルを肥大化させない。
  float_format: "%.7g"
  empty_cell_policy_ja: >-
    セルが空になるのは、このファイルを書いたファーム版がその項目を
    そもそも送らない場合だけ（既知の例は各列の description_ja/description_en
    を参照）。空欄が「直前値の保持」を意味することは無い -- 多レート信号の
    整列・補間は lib/sflog/align.py が読み込み時に行う操作であり、一次記録の
    CSV には書き込まない。
  empty_cell_policy_en: >-
    A cell is empty ONLY when the firmware version that produced this file
    does not send that field at all (see each column's description_ja/
    description_en below for known cases). An empty cell never means "value
    held from an earlier sample" -- multi-rate alignment/interpolation is a
    read-time operation performed by lib/sflog/align.py and is never written
    into a primary-record CSV.

# =============================================================================
# SI unit conventions (plan section 2.1)
# SI 単位の規約（計画書 2.1節）
# =============================================================================
units:
  timestamp: "us (microseconds)"
  angle: rad
  angular_rate: rad/s
  acceleration: "m/s^2"
  position: "m (NED frame)"
  velocity: "m/s (NED frame)"
  distance: m
  thrust: N
  torque: "N*m"
  duty: "0..1 (fraction, dimensionless)"
  voltage: V
  current: mA
  magnetic_field: uT
  pressure: Pa
  quaternion: "unitless (w,x,y,z)"
  # seq (control-cycle sequence number) has no physical unit -- see the
  # `seq` column description on each lockstep stream (imu, attitude,
  # posvel, rate_ref, motor, ctrl_output) below.
  # seq（制御周期の通し番号）に物理単位は無い -- 各ロックステップ系
  # ストリーム（imu, attitude, posvel, rate_ref, motor, ctrl_output）の
  # `seq` 列の説明を参照。
  #
  # Baro (0x45)'s wire struct sends pressure as raw hPa, not Pa (see
  # data_stream_wire.hpp WireBaro comment: "hPa on the wire, Pa inside the
  # firmware"). v1 converts to Pa (multiply by 100) at read time so
  # baro.csv stays consistent with this table's SI convention -- see that
  # column's description below for the exact conversion.
  # Baro (0x45) の電文構造体は気圧を Pa でなく生の hPa のまま送る
  # （data_stream_wire.hpp の WireBaro コメント: "hPa on the wire, Pa
  # inside the firmware"）。v1 は読み込み時に Pa へ変換する（100 倍）ため、
  # baro.csv はこの表の SI 規約と整合する -- 正確な変換は下記の列説明を
  # 参照。

# =============================================================================
# meta.json fields (plan section 2.3)
# meta.json のフィールド（計画書 2.3節）
# =============================================================================
meta_fields:
  format:
    type: str
    description_ja: 固定文字列 "stampfly-flight-log"。
    description_en: Fixed literal string "stampfly-flight-log".
  version:
    type: int
    description_ja: 形式のバージョン番号（本書は v1）。
    description_en: Format version number (this document defines v1).
  source:
    type: str
    description_ja: 取得元。"vehicle" / "sils" / "sim" のいずれか。
    description_en: Capture origin, one of "vehicle", "sils", "sim".
  created_at:
    type: str
    description_ja: バンドル生成日時。タイムゾーン付き ISO 8601 形式。
    description_en: Bundle creation timestamp, ISO 8601 with timezone.
  tool:
    type: object
    description_ja: >-
      生成ツールの情報。{name, version, git_hash} を持つ。git_hash は
      リポジトリルートで `git rev-parse --short HEAD` が取得できたときのみ
      値が入り、それ以外は null。
    description_en: >-
      Generating tool info: {name, version, git_hash}. git_hash is set only
      when `git rev-parse --short HEAD` succeeds at the repository root,
      otherwise null.
  firmware:
    type: "object|null"
    description_ja: 分かる場合のみのファーム情報 {version, git_hash}。不明なら null。
    description_en: "Firmware info {version, git_hash} when known, otherwise null."
  capture:
    type: "object|null"
    description_ja: >-
      実機取得時の接続情報 {ip, port, duration_s}。SILS・シミュレータでは
      null。
    description_en: >-
      Vehicle capture connection info {ip, port, duration_s}. Null for
      SILS/sim sources.
  streams:
    type: object
    description_ja: >-
      ストリーム名 -> 要約統計の辞書。各要約は {rows, first_timestamp_us,
      last_timestamp_us, nominal_rate_hz, measured_rate_hz} を持つ。
      measured_rate_hz は先頭・末尾のタイムスタンプと行数から計算した
      実測レート。
    description_en: >-
      Dict of stream name -> summary stats {rows, first_timestamp_us,
      last_timestamp_us, nominal_rate_hz, measured_rate_hz}.
      measured_rate_hz is computed from row count and the first/last
      timestamps.
  derived:
    type: bool
    description_ja: 一次記録は false。整列表など解析時に作った派生物は true。
    description_en: "false for a primary record; true for a derived product such as an aligned table."
  notes:
    type: "str|null"
    description_ja: >-
      自由記述の注記（例: "repeated timestamps: 1561 (imu)" のような、
      制御周期が IMU 標本を再利用した回数の記録。JSONL 変換で imu の
      seq に対応付けられなかった行数も記録する）。
    description_en: >-
      Free-form notes (e.g. "repeated timestamps: 1561 (imu)" recording
      how many control cycles reused a stale IMU sample; JSONL conversion
      also records how many rows could not be matched to an imu seq).

# =============================================================================
# Streams (plan section 2.2) -- one packet type = one CSV
# ストリーム（計画書 2.2節）-- 1パケット種別 = 1 CSV
# =============================================================================
streams:
  - name: imu
    file: imu.csv
    source: "IMU+ESKF (0x40)"
    nominal_rate_hz: 400
    required: true
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ（SILS は仮想時計）。
          制御周期が新しい IMU 標本を得られなかった周期では、前の IMU
          標本と同じ値が連続する（実機で観測済み。行の一意な識別には
          `seq` を使うこと）。
        description_en: >-
          Vehicle boot-relative microsecond timestamp (SILS: virtual
          clock). Repeats the previous cycle's value when a control cycle
          did not receive a new IMU sample (observed on real hardware --
          use `seq` to uniquely identify a row).
      - &seq_column
        name: seq
        type: int
        unit: "n/a"
        description_ja: >-
          制御周期の通し番号。実機取得では統合パケット 0x50 のヘッダ
          sequence（16bit、巻き戻りを取得側で展開）× 8 + パケット内
          インデックス。SILS では制御周期カウンタ。旧 JSONL からの変換
          では、imu ストリームの (timestamp_us, 同一時刻内の出現順) に
          対応付けた imu 側の行番号を使う。対応が取れない行は空欄。
        description_en: >-
          Control-cycle sequential number. For a real vehicle capture: the
          unified packet (0x50) header sequence (16-bit, unwrapped by the
          capture tool) x 8 + the in-packet sub-index. For SILS: the
          control-cycle counter. When converted from legacy JSONL: the
          imu stream's row number, matched by (timestamp_us, occurrence
          order within that timestamp). Empty when no match is found.
      - name: gyro_x
        type: float
        unit: "rad/s"
        description_ja: 推定器入力の角速度 X（機体座標系、フィルタ後）。
        description_en: "Estimator-input angular rate X (body frame, post-filter)."
      - name: gyro_y
        type: float
        unit: "rad/s"
        description_ja: 推定器入力の角速度 Y（機体座標系、フィルタ後）。
        description_en: "Estimator-input angular rate Y (body frame, post-filter)."
      - name: gyro_z
        type: float
        unit: "rad/s"
        description_ja: 推定器入力の角速度 Z（機体座標系、フィルタ後）。
        description_en: "Estimator-input angular rate Z (body frame, post-filter)."
      - name: accel_x
        type: float
        unit: "m/s^2"
        description_ja: 推定器入力の加速度 X（機体座標系、フィルタ後）。
        description_en: "Estimator-input acceleration X (body frame, post-filter)."
      - name: accel_y
        type: float
        unit: "m/s^2"
        description_ja: 推定器入力の加速度 Y（機体座標系、フィルタ後）。
        description_en: "Estimator-input acceleration Y (body frame, post-filter)."
      - name: accel_z
        type: float
        unit: "m/s^2"
        description_ja: 推定器入力の加速度 Z（機体座標系、フィルタ後）。
        description_en: "Estimator-input acceleration Z (body frame, post-filter)."
      - name: gyro_raw_x
        type: float
        unit: "rad/s"
        description_ja: >-
          フィルタ前の生角速度 X。vehicle ファームは IMU 側 LPF を持たない
          ため raw == filtered（電文互換のため両方送っている）。
        description_en: >-
          Pre-filter raw angular rate X. firmware/vehicle has no IMU-side
          LPF, so raw == filtered here (sent for wire compatibility with
          firmware that does filter).
      - name: gyro_raw_y
        type: float
        unit: "rad/s"
        description_ja: フィルタ前の生角速度 Y（vehicle では gyro_y と同値）。
        description_en: "Pre-filter raw angular rate Y (equals gyro_y on vehicle)."
      - name: gyro_raw_z
        type: float
        unit: "rad/s"
        description_ja: フィルタ前の生角速度 Z（vehicle では gyro_z と同値）。
        description_en: "Pre-filter raw angular rate Z (equals gyro_z on vehicle)."
      - name: accel_raw_x
        type: float
        unit: "m/s^2"
        description_ja: フィルタ前の生加速度 X（vehicle では accel_x と同値）。
        description_en: "Pre-filter raw acceleration X (equals accel_x on vehicle)."
      - name: accel_raw_y
        type: float
        unit: "m/s^2"
        description_ja: フィルタ前の生加速度 Y（vehicle では accel_y と同値）。
        description_en: "Pre-filter raw acceleration Y (equals accel_y on vehicle)."
      - name: accel_raw_z
        type: float
        unit: "m/s^2"
        description_ja: フィルタ前の生加速度 Z（vehicle では accel_z と同値）。
        description_en: "Pre-filter raw acceleration Z (equals accel_z on vehicle)."

  - name: attitude
    file: attitude.csv
    source: "IMU+ESKF (0x40)"
    nominal_rate_hz: 400
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。imu.csv と同一パケット
          由来なので、同じ行番号の imu.csv と同じ値になる。制御周期が
          新しい IMU 標本を得られなかった周期では、前の IMU 標本と同じ
          値が連続する（実機で観測済み。行の一意な識別には `seq` を
          使うこと）。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. Comes from the same
          packet as imu.csv, so the value matches imu.csv at the same row
          index. Repeats the previous cycle's value when a control cycle
          did not receive a new IMU sample (observed on real hardware --
          use `seq` to uniquely identify a row).
      - *seq_column
      - name: quat_w
        type: float
        unit: "unitless"
        description_ja: 姿勢推定クォータニオンの実部 w（機体座標系）。
        description_en: "Attitude estimate quaternion real part w (body frame)."
      - name: quat_x
        type: float
        unit: "unitless"
        description_ja: 姿勢推定クォータニオンの虚部 x。
        description_en: "Attitude estimate quaternion imaginary part x."
      - name: quat_y
        type: float
        unit: "unitless"
        description_ja: 姿勢推定クォータニオンの虚部 y。
        description_en: "Attitude estimate quaternion imaginary part y."
      - name: quat_z
        type: float
        unit: "unitless"
        description_ja: 姿勢推定クォータニオンの虚部 z。
        description_en: "Attitude estimate quaternion imaginary part z."
      - name: gyro_bias_x
        type: float
        unit: "rad/s"
        description_ja: ESKF が推定したジャイロバイアス X。
        description_en: "ESKF-estimated gyro bias X."
      - name: gyro_bias_y
        type: float
        unit: "rad/s"
        description_ja: ESKF が推定したジャイロバイアス Y。
        description_en: "ESKF-estimated gyro bias Y."
      - name: gyro_bias_z
        type: float
        unit: "rad/s"
        description_ja: ESKF が推定したジャイロバイアス Z。
        description_en: "ESKF-estimated gyro bias Z."
      - name: accel_bias_x
        type: float
        unit: "m/s^2"
        description_ja: ESKF が推定した加速度バイアス X。
        description_en: "ESKF-estimated accelerometer bias X."
      - name: accel_bias_y
        type: float
        unit: "m/s^2"
        description_ja: ESKF が推定した加速度バイアス Y。
        description_en: "ESKF-estimated accelerometer bias Y."
      - name: accel_bias_z
        type: float
        unit: "m/s^2"
        description_ja: ESKF が推定した加速度バイアス Z。
        description_en: "ESKF-estimated accelerometer bias Z."

  - name: posvel
    file: posvel.csv
    source: "PosVel (0x41)"
    nominal_rate_hz: 400
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。制御周期が新しい IMU
          標本を得られなかった周期では、前の IMU 標本と同じ値が連続する
          （実機で観測済み。行の一意な識別には `seq` を使うこと）。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. Repeats the
          previous cycle's value when a control cycle did not receive a
          new IMU sample (observed on real hardware -- use `seq` to
          uniquely identify a row).
      - *seq_column
      - name: pos_x
        type: float
        unit: "m"
        description_ja: ESKF が推定した位置 X（NED 座標系）。
        description_en: "ESKF-estimated position X (NED frame)."
      - name: pos_y
        type: float
        unit: "m"
        description_ja: ESKF が推定した位置 Y（NED 座標系）。
        description_en: "ESKF-estimated position Y (NED frame)."
      - name: pos_z
        type: float
        unit: "m"
        description_ja: ESKF が推定した位置 Z（NED 座標系、下向き正）。
        description_en: "ESKF-estimated position Z (NED frame, positive down)."
      - name: vel_x
        type: float
        unit: "m/s"
        description_ja: ESKF が推定した速度 X（NED 座標系）。
        description_en: "ESKF-estimated velocity X (NED frame)."
      - name: vel_y
        type: float
        unit: "m/s"
        description_ja: ESKF が推定した速度 Y（NED 座標系）。
        description_en: "ESKF-estimated velocity Y (NED frame)."
      - name: vel_z
        type: float
        unit: "m/s"
        description_ja: ESKF が推定した速度 Z（NED 座標系、下向き正）。
        description_en: "ESKF-estimated velocity Z (NED frame, positive down)."

  - name: rate_ref
    file: rate_ref.csv
    source: "RateRef (unified packet 0x50 fixed part)"
    nominal_rate_hz: 400
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。ControlTask は IMU
          標本の時刻をそのまま使うため、制御周期が新しい IMU 標本を
          得られなかった周期ではこの値が前の周期と同じになる -- しかし
          rate_ref 自体は制御則がその周期に計算した新しい値であり、
          timestamp_us が同じでも値は異なり得る（実機で観測済み）。
          行の対応付けには timestamp_us ではなく `seq` を使うこと。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. ControlTask reuses
          the IMU sample's own timestamp, so this repeats the previous
          cycle's value when no new IMU sample arrived that cycle --
          however rate_ref itself is freshly computed by the control law
          every cycle, so its value can differ even when timestamp_us is
          identical (observed on real hardware). Use `seq`, not
          timestamp_us, to pair rows across streams.
      - *seq_column
      - name: rate_ref_roll
        type: float
        unit: "rad/s"
        description_ja: 内側ループ（レート制御）のロール角速度目標。
        description_en: "Inner-loop (rate control) roll angular-rate reference."
      - name: rate_ref_pitch
        type: float
        unit: "rad/s"
        description_ja: 内側ループ（レート制御）のピッチ角速度目標。
        description_en: "Inner-loop (rate control) pitch angular-rate reference."
      - name: rate_ref_yaw
        type: float
        unit: "rad/s"
        description_ja: 内側ループ（レート制御）のヨー角速度目標。
        description_en: "Inner-loop (rate control) yaw angular-rate reference."

  - name: motor
    file: motor.csv
    source: "Duty400 (0x4A)"
    nominal_rate_hz: 400
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。ControlTask は IMU
          標本の時刻をそのまま使うため、制御周期が新しい IMU 標本を
          得られなかった周期ではこの値が前の周期と同じになる -- しかし
          duty 自体はミキサーがその周期に計算した新しい値であり、
          timestamp_us が同じでも値は異なり得る（実機で観測済み、
          rate_ref と同じ理由）。行の対応付けには timestamp_us ではなく
          `seq` を使うこと。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. Repeats the
          previous cycle's value when no new IMU sample arrived that
          cycle -- but the duty values themselves are freshly computed by
          the mixer every cycle, so they can differ even when
          timestamp_us is identical (observed on real hardware, same
          reason as rate_ref). Use `seq`, not timestamp_us, to pair rows
          across streams.
      - *seq_column
      - name: duty_FR
        type: float
        unit: "0..1"
        description_ja: >-
          前右モータの実際の duty 比。`sf sysid fit` のプラント入力
          （レートループ同定）。
        description_en: >-
          Actual commanded duty ratio, front-right motor. The real plant
          input `sf sysid fit` uses for rate-loop identification.
      - name: duty_RR
        type: float
        unit: "0..1"
        description_ja: 後右モータの実際の duty 比。
        description_en: "Actual commanded duty ratio, rear-right motor."
      - name: duty_RL
        type: float
        unit: "0..1"
        description_ja: 後左モータの実際の duty 比。
        description_en: "Actual commanded duty ratio, rear-left motor."
      - name: duty_FL
        type: float
        unit: "0..1"
        description_ja: 前左モータの実際の duty 比。
        description_en: "Actual commanded duty ratio, front-left motor."

  - name: ctrl_output
    file: ctrl_output.csv
    source: "ControlOutput400 (0x4B)"
    nominal_rate_hz: 400
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。ControlTask は IMU
          標本の時刻をそのまま使うため、制御周期が新しい IMU 標本を
          得られなかった周期ではこの値が前の周期と同じになる -- しかし
          指令推力・トルク自体は制御則がその周期に計算した新しい値であり、
          timestamp_us が同じでも値は異なり得る（実機で観測済み、
          rate_ref と同じ理由）。行の対応付けには timestamp_us ではなく
          `seq` を使うこと。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. Repeats the
          previous cycle's value when no new IMU sample arrived that
          cycle -- but the commanded thrust/torque themselves are freshly
          computed by the control law every cycle, so they can differ
          even when timestamp_us is identical (observed on real hardware,
          same reason as rate_ref). Use `seq`, not timestamp_us, to pair
          rows across streams.
      - *seq_column
      - name: thrust
        type: float
        unit: "N"
        description_ja: >-
          ミキサー手前のコントローラ指令推力（合計）。どのミキサーで
          飛んだかに依存しないプラント入力。
        description_en: >-
          PRE-MIXER commanded total thrust. A mixer-agnostic plant input
          (does not depend on which mixer flew).
      - name: torque_roll
        type: float
        unit: "N*m"
        description_ja: ミキサー手前のコントローラ指令ロールトルク。
        description_en: "PRE-MIXER commanded roll body torque."
      - name: torque_pitch
        type: float
        unit: "N*m"
        description_ja: ミキサー手前のコントローラ指令ピッチトルク。
        description_en: "PRE-MIXER commanded pitch body torque."
      - name: torque_yaw
        type: float
        unit: "N*m"
        description_ja: ミキサー手前のコントローラ指令ヨートルク。
        description_en: "PRE-MIXER commanded yaw body torque."

  - name: pilot
    file: pilot.csv
    source: "Control (0x42)"
    nominal_rate_hz: 50
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
