        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: throttle
        type: float
        unit: "0..1"
        description_ja: 操縦スティックのスロットル入力。
        description_en: "Pilot stick throttle input."
      - name: roll
        type: float
        unit: "-1..1"
        description_ja: 操縦スティックのロール入力。
        description_en: "Pilot stick roll input."
      - name: pitch
        type: float
        unit: "-1..1"
        description_ja: 操縦スティックのピッチ入力。
        description_en: "Pilot stick pitch input."
      - name: yaw
        type: float
        unit: "-1..1"
        description_ja: 操縦スティックのヨー入力。
        description_en: "Pilot stick yaw input."

  - name: ctrl_ref
    file: ctrl_ref.csv
    source: "CtrlRef (0x48)"
    nominal_rate_hz: 50
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: flight_mode
        type: int
        unit: "enum"
        description_ja: "飛行モード。0=ACRO, 1=STABILIZE, 2=ALT_HOLD, 3=POS_HOLD。"
        description_en: "Flight mode. 0=ACRO, 1=STABILIZE, 2=ALT_HOLD, 3=POS_HOLD."
      - name: angle_ref_roll
        type: float
        unit: "rad"
        description_ja: 外側ループ（姿勢制御）のロール角目標。
        description_en: "Outer-loop (attitude control) roll angle reference."
      - name: angle_ref_pitch
        type: float
        unit: "rad"
        description_ja: 外側ループ（姿勢制御）のピッチ角目標。
        description_en: "Outer-loop (attitude control) pitch angle reference."
      - name: total_thrust
        type: float
        unit: "N"
        description_ja: コントローラが計算した合計推力指令（50Hz）。
        description_en: "Controller-computed total thrust command (50 Hz)."
      - name: duty_FR
        type: float
        unit: "0..1"
        description_ja: >-
          前右モータの duty 比（50Hz、CtrlRef パケット由来）。400Hz の
          実測値は motor.csv を使うこと。
        description_en: >-
          Front-right motor duty ratio (50 Hz, from the CtrlRef packet).
          Prefer motor.csv for the 400 Hz measured value.
      - name: duty_RR
        type: float
        unit: "0..1"
        description_ja: 後右モータの duty 比（50Hz、CtrlRef パケット由来）。
        description_en: "Rear-right motor duty ratio (50 Hz, from the CtrlRef packet)."
      - name: duty_RL
        type: float
        unit: "0..1"
        description_ja: 後左モータの duty 比（50Hz、CtrlRef パケット由来）。
        description_en: "Rear-left motor duty ratio (50 Hz, from the CtrlRef packet)."
      - name: duty_FL
        type: float
        unit: "0..1"
        description_ja: 前左モータの duty 比（50Hz、CtrlRef パケット由来）。
        description_en: "Front-left motor duty ratio (50 Hz, from the CtrlRef packet)."
      - name: alt_setpoint
        type: float
        unit: "m"
        description_ja: 高度保持の目標高度（ALT_HOLD/POS_HOLD）。
        description_en: "Altitude-hold target altitude (ALT_HOLD/POS_HOLD)."
      - name: alt_vel_target
        type: float
        unit: "m/s"
        description_ja: 高度制御の目標上昇率。
        description_en: "Altitude-loop target climb rate."
      - name: climb_rate_cmd
        type: float
        unit: "m/s"
        description_ja: 操縦入力から生成した上昇率指令。
        description_en: "Climb-rate command derived from pilot input."
      - name: pos_setpoint_x
        type: float
        unit: "m"
        description_ja: 水平位置保持の目標位置 X（POS_HOLD、NED 座標系）。
        description_en: "Position-hold target X (POS_HOLD, NED frame)."
      - name: pos_setpoint_y
        type: float
        unit: "m"
        description_ja: 水平位置保持の目標位置 Y（POS_HOLD、NED 座標系）。
        description_en: "Position-hold target Y (POS_HOLD, NED frame)."

  - name: baro
    file: baro.csv
    source: "Baro (0x45)"
    nominal_rate_hz: 50
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: altitude
        type: float
        unit: "m"
        description_ja: 気圧高度（相対値、基準は起動時気圧）。
        description_en: "Barometric altitude (relative to the power-on reference pressure)."
      - name: pressure
        type: float
        unit: "Pa"
        description_ja: >-
          気圧。本書の SI 規約どおり Pa で統一する。電文上は hPa で
          送られる（data_stream_wire.hpp の WireBaro 構造体コメント
          「電文上は hPa、ファーム内部は Pa」参照）ため、変換時に
          ×100 して記録する。
        description_en: >-
          Pressure, unified to Pa per this document's SI convention. The
          wire sends hPa (see the WireBaro struct comment in
          data_stream_wire.hpp: "hPa on the wire, Pa inside the
          firmware"), so the conversion multiplies by 100 before
          recording.

  - name: tof_bottom
    file: tof_bottom.csv
