      - name: distance
        type: float
        unit: "m"
        description_ja: 下向き ToF センサが測定した距離。
        description_en: "Distance measured by the downward-facing ToF sensor."
      - name: status
        type: int
        unit: "enum"
        description_ja: センサ状態。0 = 有効値。
        description_en: "Sensor status. 0 = valid reading."

  - name: tof_front
    file: tof_front.csv
    source: "ToF front (0x47)"
    nominal_rate_hz: 30
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: distance
        type: float
        unit: "m"
        description_ja: 前向き ToF センサが測定した距離。
        description_en: "Distance measured by the forward-facing ToF sensor."
      - name: status
        type: int
        unit: "enum"
        description_ja: センサ状態。0 = 有効値。
        description_en: "Sensor status. 0 = valid reading."

  - name: flow
    file: flow.csv
    source: "Flow (0x43)"
    nominal_rate_hz: 100
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: dx
        type: int
        unit: "counts"
