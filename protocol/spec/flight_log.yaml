        type: int
        unit: "0..255"
        description_ja: フローセンサの信頼度指標。
        description_en: "Flow sensor quality/confidence metric."

  - name: mag
    file: mag.csv
    source: "Mag (0x46)"
    nominal_rate_hz: 25
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: x
        type: float
        unit: "uT"
