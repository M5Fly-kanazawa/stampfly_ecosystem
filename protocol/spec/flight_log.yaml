  - name: status
    file: status.csv
    source: "Status (0x4F)"
    nominal_rate_hz: 1
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: >-
          機体起動基準のマイクロ秒タイムスタンプ。Status パケットは
          uptime_ms しか持たないため timestamp_us = uptime_ms * 1000。
        description_en: >-
          Vehicle boot-relative microsecond timestamp. The Status packet
          only carries uptime_ms, so timestamp_us = uptime_ms * 1000.
      - name: uptime_ms
        type: int
        unit: "ms"
        description_ja: 起動からの経過時間。
        description_en: "Elapsed time since boot."
      - name: voltage
        type: float
        unit: "V"
        description_ja: バッテリ電圧。
        description_en: "Battery voltage."
      - name: current_ma
        type: float
        unit: "mA"
        description_ja: >-
          バッテリ電流。StatusPacket v3 (57B) 以降のみ送信。旧ファーム
          （v1/v2）を読んだ場合はこの列が空欄になる。
        description_en: >-
          Battery current. Sent only by StatusPacket v3 (57B) and later;
          empty when the source firmware only sent v1/v2.
      - name: flight_state
        type: int
        unit: "enum"
        description_ja: 飛行状態（FlightState、起動シーケンス〜飛行〜着陸）。
        description_en: "Flight state (FlightState enum: boot sequence, flight, landing, ...)."
      - name: sensor_health
        type: int
        unit: "bitmask"
        description_ja: センサ健全性のビットマスク。
        description_en: "Sensor health bitmask."
      - name: eskf_status
        type: int
        unit: "bitmask"
        description_ja: ESKF 状態のビットマスク。bit0 = 推定器初期化済み。
        description_en: "ESKF status bitmask. bit0 = estimator initialized."
      - name: reset_reason
        type: int
        unit: "enum"
        description_ja: >-
          起動時リセット理由（esp_reset_reason()）。1=POWERON, 3=SW,
          4=PANIC, 5=INT_WDT, 6=TASK_WDT, 9=BROWNOUT 等。
        description_en: >-
          Boot-time reset reason from esp_reset_reason(). E.g. 1=POWERON,
          3=SW, 4=PANIC, 5=INT_WDT, 6=TASK_WDT, 9=BROWNOUT.
      - name: pid_roll_kp
        type: float
        unit: "unitless (gain)"
        description_ja: >-
          ロールレート PID の比例ゲイン（時刻付きで記録することで飛行中の
          自動チューニングによる変更を追える）。
        description_en: >-
          Roll-rate PID proportional gain (timestamped so an in-flight
          autotune/gain change over the flight can be traced).
      - name: pid_roll_ti
        type: float
        unit: "s"
        description_ja: ロールレート PID の積分時間。
        description_en: "Roll-rate PID integral time."
      - name: pid_roll_td
        type: float
        unit: "s"
        description_ja: ロールレート PID の微分時間。
        description_en: "Roll-rate PID derivative time."
      - name: pid_pitch_kp
        type: float
        unit: "unitless (gain)"
        description_ja: ピッチレート PID の比例ゲイン。
        description_en: "Pitch-rate PID proportional gain."
      - name: pid_pitch_ti
        type: float
        unit: "s"
        description_ja: ピッチレート PID の積分時間。
        description_en: "Pitch-rate PID integral time."
      - name: pid_pitch_td
        type: float
        unit: "s"
        description_ja: ピッチレート PID の微分時間。
        description_en: "Pitch-rate PID derivative time."
      - name: pid_yaw_kp
        type: float
        unit: "unitless (gain)"
        description_ja: ヨーレート PID の比例ゲイン。
        description_en: "Yaw-rate PID proportional gain."
      - name: pid_yaw_ti
        type: float
        unit: "s"
        description_ja: ヨーレート PID の積分時間。
        description_en: "Yaw-rate PID integral time."
      - name: pid_yaw_td
        type: float
        unit: "s"
        description_ja: ヨーレート PID の微分時間。
        description_en: "Yaw-rate PID derivative time."

  - name: eskf_cov
    file: eskf_cov.csv
    source: "ESKF P-diag (0x49)"
    # Reserved packet id, not sent by any firmware today (see
    # udp_capture.py PKT_ESKF_PDIAG comment) -- nominal_rate_hz is null
    # until a firmware actually emits it.
    # 現行ファームはどれも送信しない予約パケット（udp_capture.py の
    # PKT_ESKF_PDIAG コメント参照）-- 実際に送るファームが出るまで
    # nominal_rate_hz は null。
    nominal_rate_hz: null
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: 機体起動基準のマイクロ秒タイムスタンプ。
        description_en: "Vehicle boot-relative microsecond timestamp."
      - name: p_pos_x
        type: float
        unit: "m^2"
        description_ja: ESKF 共分散行列 P の対角成分、位置 X の分散。
        description_en: "ESKF covariance matrix P diagonal entry, position-X variance."
      - name: p_pos_y
        type: float
        unit: "m^2"
        description_ja: ESKF 共分散行列 P の対角成分、位置 Y の分散。
        description_en: "ESKF covariance matrix P diagonal entry, position-Y variance."
      - name: p_pos_z
        type: float
        unit: "m^2"
        description_ja: ESKF 共分散行列 P の対角成分、位置 Z の分散。
        description_en: "ESKF covariance matrix P diagonal entry, position-Z variance."
      - name: p_vel_x
        type: float
        unit: "(m/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、速度 X の分散。
        description_en: "ESKF covariance matrix P diagonal entry, velocity-X variance."
      - name: p_vel_y
        type: float
        unit: "(m/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、速度 Y の分散。
        description_en: "ESKF covariance matrix P diagonal entry, velocity-Y variance."
      - name: p_vel_z
        type: float
        unit: "(m/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、速度 Z の分散。
        description_en: "ESKF covariance matrix P diagonal entry, velocity-Z variance."
      - name: p_att_x
        type: float
        unit: "rad^2"
        description_ja: ESKF 共分散行列 P の対角成分、姿勢誤差角 X の分散。
        description_en: "ESKF covariance matrix P diagonal entry, attitude-error-angle-X variance."
      - name: p_att_y
        type: float
        unit: "rad^2"
        description_ja: ESKF 共分散行列 P の対角成分、姿勢誤差角 Y の分散。
        description_en: "ESKF covariance matrix P diagonal entry, attitude-error-angle-Y variance."
      - name: p_att_z
        type: float
        unit: "rad^2"
        description_ja: ESKF 共分散行列 P の対角成分、姿勢誤差角 Z の分散。
        description_en: "ESKF covariance matrix P diagonal entry, attitude-error-angle-Z variance."
      - name: p_bg_x
        type: float
        unit: "(rad/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、ジャイロバイアス X の分散。
        description_en: "ESKF covariance matrix P diagonal entry, gyro-bias-X variance."
      - name: p_bg_y
        type: float
        unit: "(rad/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、ジャイロバイアス Y の分散。
        description_en: "ESKF covariance matrix P diagonal entry, gyro-bias-Y variance."
      - name: p_bg_z
        type: float
        unit: "(rad/s)^2"
        description_ja: ESKF 共分散行列 P の対角成分、ジャイロバイアス Z の分散。
        description_en: "ESKF covariance matrix P diagonal entry, gyro-bias-Z variance."
      - name: p_ba_x
        type: float
        unit: "(m/s^2)^2"
        description_ja: ESKF 共分散行列 P の対角成分、加速度バイアス X の分散。
        description_en: "ESKF covariance matrix P diagonal entry, accel-bias-X variance."
      - name: p_ba_y
        type: float
        unit: "(m/s^2)^2"
        description_ja: ESKF 共分散行列 P の対角成分、加速度バイアス Y の分散。
        description_en: "ESKF covariance matrix P diagonal entry, accel-bias-Y variance."
      - name: p_ba_z
        type: float
        unit: "(m/s^2)^2"
        description_ja: ESKF 共分散行列 P の対角成分、加速度バイアス Z の分散。
        description_en: "ESKF covariance matrix P diagonal entry, accel-bias-Z variance."

  - name: truth
    file: truth.csv
    # Produced only by SILS / the standalone simulator -- there is no
    # vehicle packet, the physics plant model itself is the source.
    # SILS / シミュレータ単体でのみ生成される -- 対応する機体パケットは無く、
    # 物理プラントモデル自身が由来。
    source: "sils/sim"
    nominal_rate_hz: null
    required: false
    columns:
      - name: timestamp_us
        type: int
        unit: "us"
        description_ja: シミュレータの仮想時計によるマイクロ秒タイムスタンプ。
        description_en: "Microsecond timestamp from the simulator's virtual clock."
      - name: pos_x
        type: float
        unit: "m"
        description_ja: 物理モデルの真の位置 X（NED 座標系）。
        description_en: "Physics-model ground-truth position X (NED frame)."
      - name: pos_y
        type: float
        unit: "m"
        description_ja: 物理モデルの真の位置 Y（NED 座標系）。
        description_en: "Physics-model ground-truth position Y (NED frame)."
      - name: pos_z
        type: float
        unit: "m"
        description_ja: 物理モデルの真の位置 Z（NED 座標系、下向き正）。
        description_en: "Physics-model ground-truth position Z (NED frame, positive down)."
      - name: quat_w
        type: float
        unit: "unitless"
        description_ja: 物理モデルの真の姿勢クォータニオン実部 w。
        description_en: "Physics-model ground-truth attitude quaternion real part w."
      - name: quat_x
        type: float
        unit: "unitless"
        description_ja: 物理モデルの真の姿勢クォータニオン虚部 x。
        description_en: "Physics-model ground-truth attitude quaternion imaginary part x."
      - name: quat_y
        type: float
        unit: "unitless"
        description_ja: 物理モデルの真の姿勢クォータニオン虚部 y。
        description_en: "Physics-model ground-truth attitude quaternion imaginary part y."
      - name: quat_z
        type: float
        unit: "unitless"
        description_ja: 物理モデルの真の姿勢クォータニオン虚部 z。
        description_en: "Physics-model ground-truth attitude quaternion imaginary part z."
      - name: vel_x
        type: float
        unit: "m/s"
