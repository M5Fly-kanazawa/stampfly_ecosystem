      Km:
        value: 5.682e-4
        unit: "V/(rad/s)"
        method: "コーストダウン開回路EMF実測（SCPI公式換算）"
        method_en: "Coast-down open-circuit EMF measurement (SCPI-formula conversion)"
        date: "2026-07-16"
        note: >
