# StampFly Physical Parameters — Single Source of Truth (SSOT)
# StampFly 物理パラメータ — 基準となる文書（Single Source of Truth）
#
# This file is read by `sf params generate` (tools/params_audit/generate.py),
# which machine-generates:
#   - tools/sysid/_generated_params.py           (flat Python constants)
#   - simulator/sils/plant/generated_params.hpp   (C++ constexpr constants)
#   - the <!-- AUTO-GENERATED:params --> marker table in
#     docs/architecture/stampfly-parameters.md (JP + EN)
#
# To change a value: edit this file, run `sf params generate`, then commit
# both this file and the regenerated outputs. Never hand-edit a generated
# file directly — `sf params generate --check` (also run in CI) fails if a
# generated file has drifted from this source.
#
# 本ファイルは `sf params generate`（tools/params_audit/generate.py）が読み込み、
# 以下を機械生成する:
#   - tools/sysid/_generated_params.py           （フラットな Python 定数）
#   - simulator/sils/plant/generated_params.hpp   （C++ constexpr 定数）
#   - docs/architecture/stampfly-parameters.md 内の
#     <!-- AUTO-GENERATED:params --> マーカー表（日本語・英語）
#
# 値を変更する手順: 本ファイルを編集 → `sf params generate` を実行 →
# 本ファイルと生成物の両方をコミットする。生成物を直接手編集しないこと —
# `sf params generate --check`（CIでも実行）が、生成物が本ファイルから
# 乖離していれば失敗する。

meta:
  updated: "2026-08-03"
  description:
    ja: >
      StampFly の機体物理パラメータ（幾何・剛体慣性・モータ／プロペラの
      電気機械係数）を集約する。control/README.md が定義する models/
      の用途（数学モデル・同定結果置き場）に沿う。較正（モータ実測）に
      依存しない値は constants に、実測キャンペーンごとに連動する値の
      組は calibration_sets に分ける。
    en: >
      Consolidates StampFly's vehicle physical parameters (geometry, rigid-
      body inertia, motor/propeller electromechanical coefficients).
      Matches the role of models/ documented in control/README.md
      (mathematical models and system-identification results). Values that
      do not depend on a motor-measurement campaign live under constants;
      values that are coupled within one measurement campaign are grouped
      under calibration_sets.

# ==============================================================================
# Calibration-independent geometry & rigid-body inertia.
# 較正（モータ実測キャンペーン）に依存しない機体形状・剛体慣性。
#
# NOTE: as of Phase 1 these constants are NOT yet wired into
# tools/sysid/defaults.py's DEFAULT_PARAMS (which keeps its own hand-written
# literals for mass/Ixx/Iyy/Izz/arm_length, per the Phase-1 task scope) — only
# tools/params_audit/params_manifest.py's EXPECTED_* comparison values and
# simulator/sils/plant/generated_params.hpp draw from here. Wiring
# DEFAULT_PARAMS itself to this file is left to a future phase.
# 注: Phase 1 時点ではこれらの定数は tools/sysid/defaults.py の
# DEFAULT_PARAMS（mass/Ixx/Iyy/Izz/arm_length は引き続き手書きリテラルを保持、
# Phase 1 のタスク範囲による）へは未配線 — ここから値を引くのは
# tools/params_audit/params_manifest.py の EXPECTED_* 比較値と
# simulator/sils/plant/generated_params.hpp のみ。DEFAULT_PARAMS 自体の配線は
# 将来フェーズに委ねる。
# ==============================================================================
constants:
  mass:
    value: 0.037
    unit: "kg"
    date: "2026-03-31"
    source: >
      実測36.8g。ファームウェア反映は commit 43841314
      "fix(control): update vehicle mass to 37g for accurate hover thrust"
      （2026-03-31）。シミュレータ側（旧0.035kg）は2026-07-24に統一
      （更新漏れであり個体差ではないと確認済み）。
  Ixx:
    value: 9.16e-6
    unit: "kg·m²"
    date: "unknown"
    source: >
      Roll慣性モーメント。開発者による2点吊り法の実測値。
      J = m·g·D²·T²/(16·h·π²)（h: 糸の長さ、D: 糸の間隔、T: 捻り振動の周期）、
      m = 0.0364 kg（測定時の機体質量）。測定記録（2026-10-30 に開発者が提示）:
        x: h 0.282 m, D 0.078 m, T 0.43404 s → 9.19e-6
        y: h 0.350 m, D 0.078 m, T 0.58230 s → 13.3e-6
        z: h 0.370 m, D 0.100 m, T 0.57815 s → 20.4e-6
      注意: この記録から計算すると Ixx は 9.188e-6 で、本値 9.16e-6 と 0.3 % 違う
      （本値の由来は未確認。値は変更していない）。垂直軸の定理による検算
      Ixx+Iyy=22.5e-6 対 Izz=20.4e-6（比 0.91）は公開教材 multicopter_introduction
      付録 D にある。
      Developer's bifilar (two-string torsion pendulum) measurement,
      J = m g D^2 T^2 / (16 h pi^2), m = 0.0364 kg; record above. The record
      gives Ixx = 9.188e-6, 0.3 % above this value (origin of 9.16e-6 unconfirmed).
  Iyy:
    value: 13.3e-6
    unit: "kg·m²"
    date: "unknown"
    source: "Pitch慣性モーメント。2点吊り法の実測値（Ixx の source 参照）。Bifilar measurement, see Ixx."
  Izz:
    value: 20.4e-6
    unit: "kg·m²"
    date: "unknown"
    source: "Yaw慣性モーメント。2点吊り法の実測値（Ixx の source 参照）。Bifilar measurement, see Ixx."
  arm_offset:
    value: 0.023
    unit: "m"
    date: "unknown"
    source: >
      モーメントアーム（重心→モータの X/Y オフセット）。出所文書は未特定
      （全実装で既に一致済み）。対角のモーター間距離は 2×arm_offset/√2×2
      = 0.065 m（アーム長 0.0325 m = arm_offset×√2、docs/architecture/
      stampfly-parameters.md §2「機体形状」参照）。
  urdf_base_mass:
    value: 0.033
    unit: "kg"
    date: "2026-07-24"
    source: >
      simulator/shared/assets/meshes/parts/stampfly.urdf の base_link
      単体質量。base_link(0.033) + 4×プロペラリンク(各0.001) = mass(0.037)。
      独立した実測値ではなく mass からの差し引きで決まる表現上の値
      （tools/params_audit/params_manifest.py EXPECTED_URDF_BASE_MASS 参照）。

# ==============================================================================
# Motor/propeller electromechanical coefficient sets. Values inside ONE set
# are coupled (derived/cross-checked together) — never swap a single member
# of a set without re-deriving the others.
# モータ／プロペラの電気機械係数セット。1セット内の値は連動しており
# （互いに導出・整合検証されているため）、セット内の1値だけを差し替えては
# ならない。
# ==============================================================================
calibration_sets:
  # ----------------------------------------------------------------------------
  # SILS plant propulsion (2026-10-30, Phase A+B of the R_out plant change).
  # Physical measurement ranks above the SILS (developer decision, 2026-10-30):
  # the SILS plant's motor + drive model is the AVERAGED CAPACITOR-RECIRCULATION
  # circuit model with the bench constants of 2026-10-15:
  #   I_m  = (V_batt - Ke*w) / R_out(D)        (I_m = 0 when D < 0.01)
  #   J dw/dt = Kt*I_m - Cq*w^2 - Kt*(I0a + I0b*w^2)
  #   T    = eta * Ct * w^2                    (eta = thrust_efficiency)
  # battery current per motor = max(I_m, 0) (in this circuit the mean battery
  # current equals the mean motor current). The old D*V electrical model
  # ((D*V - Km*w)/Rm) is removed from the plant (git history keeps it).
  # Evidence, residuals and the open items: analysis/notes/ct_cq_bench_20261015.md.
  # Circuit model: the developers' paper (under review) on StampFly's capacitor-
  # recirculation drive circuit. R_out depends on D and C_C only, not on the
  # battery voltage nor on w (as built); the code that computes the calculated
  # table is NOT in this repository.
  # SILS プラントの推進系（2026-10-30、R_out プラント変更の Phase A+B）。
  # 物理の実測を SILS より上位に置く（開発者決定、2026-10-30）: SILS プラントの
  # モータ＋駆動モデルを、2026-10-15 のベンチ定数を使った「コンデンサ還流方式の
  # 平均化回路モデル」にする（式は上の英文参照）。電池電流（モータ1個あたり）は
  # max(I_m,0)（この回路では平均電池電流が平均モータ電流に等しい）。旧 D×V 電気
  # モデル（(D·V−Km·ω)/Rm）はプラントから撤去（履歴は git が保持）。
  # 根拠・残差・未決事項は analysis/notes/ct_cq_bench_20261015.md。回路モデルは
  # 開発者らの論文（査読中）による。R_out は D と C_C だけで決まり、電池電圧にも
  # ω にもよらない（構成上）。計算表を出すコードは本リポジトリには無い。
  #
  # NOTE (extra actuator delay, NOT adopted): an extra ~4 ms actuator delay is
  # indicated by flight data (flip forward model delta 3-4 ms, hover delta 4-8 ms,
  # as-flown flip reproduction best at 4 ms) but not adopted; to be settled by the
  # duty-step bench measurement (stampfly-motor-autotest
  # docs/procedure_long_discharge.md, measurement D). The plant default
  # motor_delay_ms therefore stays 0.
  # 注（追加のアクチュエータ遅れ、未採用）: 飛行データは追加で約4 ms のアクチュエータ
  # 遅れを示す（宙返りの順モデルで δ 3〜4 ms、ホバーで δ 4〜8 ms、飛んだとおりの
  # 宙返りの再現は 4 ms が最良）が、採用しない。Duty ステップのベンチ計測
  # （stampfly-motor-autotest の docs/procedure_long_discharge.md、計測D）で決める。
  # よってプラント既定の motor_delay_ms は 0 のまま。
  # ----------------------------------------------------------------------------
  bench_2026_10_15:
    status: adopted
    role: "SILS plant propulsion"
    coupled: true
    note: >
      Extra actuator delay (NOT adopted): an extra ~4 ms actuator delay is indicated
      by flight data (flip forward model delta 3-4 ms, hover delta 4-8 ms, as-flown
      flip reproduction best at 4 ms) but not adopted; to be settled by the duty-step
      bench measurement (stampfly-motor-autotest docs/procedure_long_discharge.md,
      measurement D). The plant default motor_delay_ms therefore stays 0.
      追加のアクチュエータ遅れ（未採用）: 飛行データは追加で約 4 ms の遅れを示す
      （宙返りの順モデルで δ 3〜4 ms、ホバーで δ 4〜8 ms、飛んだとおりの宙返りの
      再現は 4 ms が最良）が採用しない。Duty ステップのベンチ計測（stampfly-motor-
      autotest の docs/procedure_long_discharge.md、計測 D）で決める。プラント既定の
      motor_delay_ms は 0 のまま。
    params:
      Ke:
        value: 5.905e-4
        unit: "V·s/rad"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（開回路EMF）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (open-circuit EMF)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15); the developers' paper under review (circuit model)"
        note: >
          Back-EMF constant. Kt = Ke in SI units (same number, N·m/A). / 逆起電力定数。SI では Kt = Ke（同じ数値、N·m/A）。
      Kt:
        value: 5.905e-4
        unit: "N·m/A"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（Ke と同値）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (equal to Ke)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15); equal to Ke in SI"
        note: >
          Torque constant, equal to Ke in SI units. / トルク定数。SI では Ke と同値。
      Cq:
        value: 3.38e-11
        unit: "N·m/(rad/s)²"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15)"
        note: >
          Torque coefficient Q = Cq·w^2 (the plant uses it directly as the body reaction torque).
          / トルク係数 Q=Cq·ω²（プラントは機体への反トルクとして直接使う）。
      Ct:
        value: 7.60e-9
        unit: "N/(rad/s)²"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（推力は秤で計測）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (thrust on a scale)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15)"
        note: >
          Thrust coefficient T = eta·Ct·w^2. Per-step Ct varies from 6.3e-9 (D 0.1) to 7.8e-9 (D 0.9); the single value is the bench fit. 1 motor (M1) only.
          / 推力係数 T=η·Ct·ω²。ステップごとの Ct は D 0.1 の 6.3e-9 から D 0.9 の 7.8e-9 まで変わる（1 値はベンチのフィット）。1 モータ（M1）のみ。
      J:
        value: 1.54e-8
        unit: "kg·m²"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（プロペラ込みのロータ慣性）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (rotor inertia including the propeller)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15)"
      I0a:
        value: 0.0443
        unit: "A"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（無負荷電流の定数部）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (constant part of the no-load current)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15); the developers' paper under review (circuit model)"
        note: >
          No-load current I0 = I0a + I0b·w^2. The constant part acts as Coulomb-like friction Kt·I0a, applied unconditionally (same style as the old Qf).
          / 無負荷電流 I0=I0a+I0b·ω²。定数部はクーロン摩擦風の Kt·I0a で、旧 Qf と同じ流儀で無条件に減算。
      I0b:
        value: 2.915e-9
        unit: "A/(rad/s)²"
        method: "ベンチ実測（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（無負荷電流の ω² 部）"
        method_en: "Bench measurement (2026-10-15, public repository stampfly-motor-autotest, data/2026-10-15) (w^2 part of the no-load current)"
        date: "2026-10-15"
        source: "bench measurement 2026-10-15 with the public stampfly-motor-autotest (data/2026-10-15); the developers' paper under review (circuit model)"
        note: >
          Extra drag Kt·I0b·w^2. / 追加の抗力 Kt·I0b·ω²。
      C_C:
        value: 0.1e-6
        unit: "F"
        method: "基板の部品定数（2026-10-15、公開リポジトリ stampfly-motor-autotest の data/2026-10-15）（R_out 表の前提）"
        method_en: "Board component value (premise of the R_out table)"
        date: "2026-10-15"
        source: "board component value; the developers' paper under review (circuit model); premise of the R_out table"
        note: >
          Recirculation capacitor of the board. Informational: it only fixes which R_out table applies. / 基板の還流コンデンサ。情報用: どの R_out 表を使うかを決めるだけ。
      f_pwm:
        value: 150000.0
        unit: "Hz"
        method: "基板の PWM 周波数（情報用）"
        method_en: "Board PWM frequency (informational)"
        date: "2026-10-15"
        source: "board PWM setting; the developers' paper under review (circuit model); informational"
        note: >
          Informational only; the averaged model does not use it directly. / 情報用。平均化モデルは直接使わない。
      thrust_efficiency:
        value: 0.976
        unit: "-"
        method: "飛行ログのホバー釣り合いから決定（η = m·g / Σ_i T(D_i, V)、9 本・299 サンプル）"
        method_en: "Determined from the flight hover balance (eta = m*g / sum_i T(D_i, V), 9 logs, 299 samples)"
        date: "2026-10-31"
        source: "flight logs 2026-07-17 x5, 07-18 x2, 09-08, 10-02 flip_test1; analysis/notes/ct_cq_bench_20261015.md"
        note: >
          飛行ログのホバー釣り合いから決めた: η = m·g / Σ_i T(D_i, V)。
          各モータの指令 duty D_i と基板電圧 V（1 秒ごとのホバー区間サンプル）を
          採用した R_out 表（下記）に通して推力 T を計算する。9 本の飛行ログ
          （2026-07-17 ×5、07-18 ×2、09-08、10-02 flip_test1）の 299 サンプル、
          m = 0.037 kg。中央値 0.976、p16〜p84 は 0.963〜0.996、電圧に対する
          傾きは 3.64〜4.10 V で +0.005/V（電圧依存なし）。解釈: ベンチの単独
          モータと機体搭載時の間にある設置・干渉損失。m = 0.0364 kg（二本吊り
          測定の質量）を使うと 0.960 になる。
          Determined from the flight hover balance, eta = m*g / sum_i T(D_i, V),
          with the per-motor commanded duties D_i and the board voltage V of every
          1-s hover sample, evaluated through the adopted R_out table (below), in
          9 flight logs (2026-07-17 x5, 07-18 x2, 09-08, 10-02 flip_test1; 299
          samples), m = 0.037 kg: median 0.976, p16-p84 0.963-0.996, slope versus
          voltage +0.005 per V over 3.64-4.10 V (no voltage dependence).
          Interpretation: installation/interference loss between the single motor
          on the bench and the airframe in flight. With m = 0.0364 kg (the
          bifilar measurement mass) it would be 0.960.
          (Previously 1.0 = bench Ct as-is, 2026-10-30; the former default 0.7133
          was bookkeeping for the firmware curve and the old plant motor being two
          different motors, 2026-08-22.)
          （旧: 2026-10-30 は 1.0＝ベンチの Ct そのまま。さらに前の既定 0.7133 は
          ファームの曲線と旧プラントのモータが別物だったことへの帳尻合わせ、
          2026-08-22。）
    # --- R_out(D) table: three layers, all stored here --------------------------
    # --- R_out(D) 表: 3 層、すべてここに保存 -------------------------------------
    # (a) measured_points : bench measurement. R_out = (V_DD - Ke*w) / I_bat from the
    #     bench summary. D is the COMMANDED duty.
    # (b) calc            : period-steady averaged circuit solved by state-transition
    #     matrices for the board C_C (code not in this repository); independent of the
    #     battery voltage. D = 0.01 .. 1.00 in 0.01 steps [ohm].
    # (c) adopted         : calc x r(D), r piecewise-linear through the measured/calc
    #     ratios at D 0.1 .. 0.9 (the two D 0.5 ratios averaged), held constant below
    #     0.1 and above 0.9. COMPUTED BY THE GENERATOR (tools/params_audit/generate.py)
    #     from (a) and (b): no hand-typed adopted numbers. The plant uses (c).
    # (a) measured_points: ベンチ実測。R_out=(V_DD−Ke·ω)/I_bat（ベンチ要約）。D は指令 duty。
    # (b) calc: 基板の C_C に対し、周期定常の平均化回路を状態遷移行列で解いた表
    #     （コードは本リポジトリに無い）。電池電圧によらない。D=0.01〜1.00、0.01 刻み[Ω]。
    # (c) adopted: calc × r(D)。r は D 0.1〜0.9 の実測/計算比を通る区分線形
    #     （D 0.5 の 2 点は平均）、0.1 未満と 0.9 超は定数で保持。生成器が (a)(b) から
    #     計算する（手書きの採用値は無い）。プラントは (c) を使う。
    rout_table:
      measured_points:
        # [D, R_out_ohm, V_DD_V, run_tag]
        - [0.1, 26.187, 4.378, pwm_c01_d10]
        - [0.2, 12.065, 4.364, pwm_c01_d20]
        - [0.3, 7.332, 4.349, pwm_c01_d30]
        - [0.4, 4.884, 4.328, pwm_c01_d40]
        - [0.5, 3.479, 4.302, pwm_c01_d50]
        - [0.5, 3.463, 4.236, pwm_c01_d50_rep]
        - [0.6, 2.563, 4.278, pwm_c01_d60]
        - [0.7, 2.072, 4.253, pwm_c01_d70]
        - [0.8, 1.547, 4.223, pwm_c01_d80]
        - [0.9, 0.941, 4.173, pwm_c01_d90]
      calc:
        method: "period-steady averaged circuit solved by state-transition matrices (code not in this repository)"
        method_ja: "状態遷移行列で解いた周期定常の平均化回路（コードは本リポジトリに無い）"
        source: "analysis/scripts/ct_cq_bench_20261015/rout/rout_table_c01.csv"
        c_c_farad: 0.1e-6
        # [D, R_out_ohm], D = 0.01 .. 1.00
