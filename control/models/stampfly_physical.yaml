        value: 2.76e-5
        unit: "N·m"
        note: "静止摩擦トルク（旧ファミリ）。tools/sysid/defaults.py DEFAULT_PARAMS.motor.Qf と同値だが、Phase 1では未配線。"

  # Flight-anchored motor curve (2026-08-22) -- a mechanical fold of
  # legacy_motor_curve's Am/Bm/Cm above with the flight-verified correction
  # hover.thrust_corr=1.12. What was actually validated on real hardware was
  # never the legacy curve alone -- per the firmware's own long-standing
  # comment ("the ideal motor curve overestimates thrust, so real hardware
  # only hovers after a x1.12 correction"), it was ALWAYS "legacy curve x
  # corr 1.12" as one combined mapping, split across two constants: a static
  # curve in firmware/vehicle/components/sf_actuator/actuator.cpp and a
  # runtime NVS parameter hover.thrust_corr in params.cpp. This set folds
  # that combination into a single curve so hover.thrust_corr can revert to
  # its intended meaning (per-unit trim, nominal 1.0) instead of silently
  # carrying a systematic motor-curve correction on every vehicle.
  # Derivation: holding duty identical while corr goes 1.12 -> 1.0 requires,
  # at every thrust T, omega_new = sqrt(T/1.0/Ct) = omega_legacy / sqrt(1.12).
  # Substituting into V = Am*omega^2 + Bm*omega + Cm shows that
  # Am_new = Am_legacy x 1.12, Bm_new = Bm_legacy x sqrt(1.12), and
  # Cm_new = Cm_legacy (unchanged) reproduce V_new(omega_new) =
  # V_legacy(omega_legacy) EXACTLY across the whole thrust range -- not an
  # approximation. firmware/vehicle/components/sf_actuator/actuator.cpp's
  # MOTOR_AM/MOTOR_BM/MOTOR_CM are the sole consumer of this set as of
  # 2026-08-22 (previously they held the legacy_motor_curve literals above).
  #
  # IMPORTANT CAVEAT (read before citing either curve family as "the" motor
  # model): this static V-omega curve family (legacy_motor_curve, and this
  # flight_anchored derivative of it) is an algebraic paraphrase of a
  # DIFFERENT electrical family than the one measured_2026_07/plant.hpp's ODE
  # uses (Am = Rm*Cq/Km etc., see docs/architecture/stampfly-parameters.md
  # section 3 "Derived Parameters" footnote). The two families describe TWO
  # DIFFERENT MOTORS -- they diverge by a factor of approximately 1.252x in
  # thrust at the hover operating point. No V-omega-T simultaneous
  # measurement exists on the new propeller (see measured_2026_07.Ct's note
  # above), so which family (if either) is physically correct remains
  # UNDECIDED (backlog #3). This fold does NOT assert new physics and does
  # NOT resolve that gap -- it only consolidates the single flight-validated
  # (legacy curve + corr 1.12) mapping into one place so it stops being split
  # across two constants that could silently drift apart.
  #
  # フライト実証済みモータ曲線（2026-08-22）—— legacy_motor_curve の
  # Am/Bm/Cm と、実飛行で検証済みの補正 hover.thrust_corr=1.12 を機械的に
  # 畳み込んだもの。ファーム側の従来からのコメント通り「理想モータ曲線は
  # 推力を過大評価するため、実機は×1.12の補正をしないとホバーしない」——
  # 実飛行で検証されていたのは legacy 曲線単体ではなく、常に「legacy 曲線 +
  # corr 1.12」という組み合わせ全体であり、それが2つの定数（firmware/
  # vehicle/components/sf_actuator/actuator.cpp の静的曲線と、params.cpp の
  # 実行時NVSパラメータ hover.thrust_corr）に分割して持たれていた。本セットは
  # この組み合わせを1つの曲線に畳み込み、hover.thrust_corr が本来の意味
  # （個体差トリム、公称=1.0）へ戻れるようにする——そうしなければ全機体が
  # 気づかれないままモータ曲線の系統的補正を黙って抱え続けることになる。
  # 導出: duty を変えずに corr を 1.12→1.0 にするには、全推力域で
  # ω_new=√(T/1.0/Ct)=ω_legacy/√1.12 が必要で、V = Am·ω²+Bm·ω+Cm に代入すると
  # Am_new=Am_legacy×1.12、Bm_new=Bm_legacy×√1.12、Cm_new=Cm_legacy（変更なし）
  # とすれば V_new(ω_new)=V_legacy(ω_legacy) が近似ではなく全推力域で厳密に
  # 成立することが分かる。firmware/vehicle/components/sf_actuator/
  # actuator.cpp の MOTOR_AM/MOTOR_BM/MOTOR_CM が2026-08-22時点で本セットの
  # 唯一の消費者（それ以前は上記 legacy_motor_curve のリテラルを保持して
  # いた）。
  #
  # 重要な注記（どちらの曲線ファミリも「唯一のモータモデル」として引用する前に
  # 必読）: この静的 V-ω 曲線ファミリ（legacy_motor_curve、および本
  # derivative である flight_anchored）は、measured_2026_07/plant.hpp の
  # ODE が使う電気系ファミリとは別物の代数的言い換え（Am=Rm·Cq/Km 等、
  # docs/architecture/stampfly-parameters.md §3「派生パラメータ」脚注参照）
  # である。両ファミリは別のモータを記述しており、ホバー点で約1.252倍の
  # 推力差がある。新プロペラでの V-ω-T 同時計測が一度も行われていないため
  # （measured_2026_07.Ct の note 参照）、どちらのファミリが（あるいは
  # どちらも）物理的に正しいかは未決着のまま（バックログ#3）。本畳み込みは
  # 新しい物理を主張するものでも、その未決着を解消するものでもなく、単一の
  # 飛行実証済み写像（legacy曲線+corr1.12）を1箇所に集約しただけである。
  # UPDATE (2026-10-30): this set is now THE explicit firmware thrust->duty set
  # (status adopted, role firmware). Ct_gauge and kappa were added to it so the
  # five constants firmware/vehicle/components/sf_actuator/actuator.cpp holds
  # (MOTOR_CT, KAPPA, MOTOR_AM, MOTOR_BM, MOTOR_CM) live in ONE set, instead of
  # Ct/kappa riding on measured_2026_07 (which the SILS plant no longer reads).
  # Extended rather than duplicated into a new set so Am/Bm/Cm keep their fold
  # provenance above. Generated as sils_params::firmware_curve (C++) and the
  # EXPECTED_FW_* constants (Python). The values are the ones actuator.cpp holds
  # today; firmware is unchanged.
  # 2026-10-30 更新: 本セットを「ファームの推力→duty 換算の明示的な1セット」とする
  # （status adopted、role firmware）。actuator.cpp が持つ5定数（MOTOR_CT・KAPPA・
  # MOTOR_AM・MOTOR_BM・MOTOR_CM）を1か所にまとめるため Ct_gauge と kappa を追加した
  # （Ct/kappa を、SILS プラントがもう読まない measured_2026_07 に同居させない）。
  # 新セットに複製せず拡張したのは、Am/Bm/Cm の畳み込みの来歴を保つため。
  # 値は actuator.cpp が現在持つ値そのまま。ファームは変更しない。
  flight_anchored_motor_curve:
    status: adopted
    role: firmware
    coupled: true
    params:
      Ct_gauge:
        value: 1.00e-8
        unit: "N/(rad/s)²"
        date: "2026-10-30"
        method: "ファームの換算が使う推力ゲージ係数（actuator.cpp の MOTOR_CT）。2026-08-03 の暫定採用値"
        method_en: "Thrust gauge coefficient the firmware conversion uses (MOTOR_CT in actuator.cpp). Provisional adoption of 2026-08-03"
        note: >
          ω=sqrt(T/Ct_gauge) in the firmware's thrust->duty conversion. It is a GAUGE constant of the firmware curve, not a claim about the propeller's true Ct (bench Ct is 7.60e-9, see bench_2026_10_15). Am/Bm/Cm below are expressed against this Ct_gauge.
          ファームの推力→duty 換算の ω=sqrt(T/Ct_gauge)。ファーム曲線の「ゲージ」定数であり、プロペラの真の Ct の主張ではない（ベンチの Ct は 7.60e-9、bench_2026_10_15 参照）。下の Am/Bm/Cm はこの Ct_gauge に対する値。
      kappa:
        value: 4.10e-3
        unit: "m"
        date: "2026-08-03"
        method: "ファームのミキサー B^-1 が使うトルク/推力比（actuator.cpp の KAPPA）= Cq/Ct の丸め不要の値"
        method_en: "Torque/thrust ratio the firmware mixer B^-1 uses (KAPPA in actuator.cpp) = Cq/Ct, exact"
        note: >
          measured_2026_07.kappa_adopted と同値（4.10e-3）。ファームの rate.yaw.kp / rate.yaw.max_torque はこの κ に対して同率再スケール済み。bench の Cq/Ct（3.38e-11/7.60e-9=4.45e-3）はファーム未反映。
          Same value as measured_2026_07.kappa_adopted. The firmware's rate.yaw.kp / rate.yaw.max_torque are rescaled against this kappa. The bench Cq/Ct (3.38e-11/7.60e-9 = 4.45e-3) is NOT in the firmware.
      Am:
        value: 6.0368e-8
        unit: "V/(rad/s)²"
        date: "2026-08-22"
        note: >
          legacy_motor_curve.Am(5.39e-8) × 1.12 の機械的な畳み込み——ホバーに
          必須だった hover.thrust_corr=1.12 をモータ曲線側へ吸収した値
          （このファミリ冒頭コメントの導出参照）。5.39e-8×1.12=6.0368e-8。
          legacy_motor_curve.Am の値からの機械的導出であり、新しい実測では
          ない。firmware/vehicle/components/sf_actuator/actuator.cpp の
          MOTOR_AM が現在の唯一の消費者（2026-08-22〜）。
      Bm:
        value: 6.699042e-4
        unit: "V/(rad/s)"
        date: "2026-08-22"
        note: >
          legacy_motor_curve.Bm(6.33e-4) × √1.12 の機械的な畳み込み
          （このファミリ冒頭コメントの導出参照、根拠は Am と同一）。
          6.33e-4×√1.12=6.33e-4×1.058300...=6.699042e-4。
          legacy_motor_curve.Bm の値からの機械的導出であり、新しい実測では
          ない。firmware/vehicle/components/sf_actuator/actuator.cpp の
          MOTOR_BM が現在の唯一の消費者（2026-08-22〜）。
      Cm:
        value: 1.53e-2
        unit: "V"
        date: "2026-08-22"
        note: >
          legacy_motor_curve.Cm と数値変更なし——畳み込み式は
          Cm_new=Cm_legacy であり、定数項は corr の影響を受けない（Am/Bm の
          note 参照）。firmware/vehicle/components/sf_actuator/actuator.cpp
          の MOTOR_CM が現在の唯一の消費者（2026-08-22〜、値は
          legacy_motor_curve.Cm と同一）。


  # ----------------------------------------------------------------------------
  # SILS plant fidelity fit from the first real flip log (2026-10-02).
  # NOT a bench measurement of a single physical quantity: these three numbers
  # are effective plant-level correction factors identified so that the SILS
  # plant reproduces the hardware duty -> roll-rate dynamics of the failed flip
  # (logs/flip_test1.sflog.zip). They are consumed ONLY by the SILS plant
  # (formerly via the opt-in profile flip_fit_2026_10; retired 2026-10-31); the
  # firmware does not use them. Evidence and residuals: docs/architecture/simulation-policy.md §5
  # ("2026-10-02 追記") and docs/plans/flip-maneuver-plan.md §5.6.
  # 最初の実機宙返りログ（2026-10-02）からの SILS プラント忠実度フィット。
  # 単一の物理量のベンチ実測ではなく、SILS プラントが失敗した宙返りの実機の
  # duty→ロールレート動特性を再現するよう同定した、プラント全体の実効補正係数
  # （3 値）。SILS プラント専用（旧オプトインのプロファイル flip_fit_2026_10 経由、
  # 2026-10-31 に退役）。ファームは使わない。
  # ----------------------------------------------------------------------------
  # UPDATE (2026-10-31): SUPERSEDED and RETIRED (values untouched). These factors
  # were identified against the OLD V0 motor model (D*V electrical ODE); they
  # double-count with the R_out drive of bench_2026_10_15 (which already
  # reproduces the lower duty->roll-acceleration gain). The opt-in plant profile
  # flip_fit_2026_10, the sils_params::plant_fit::* generator output and the
  # *_fit scenarios were removed on 2026-10-31; this set is kept as a record only.
  # The as-flown failure is reproduced instead by the scenario flip_test2_repro.
  # 2026-10-31 更新: 置き換え済み、かつ退役（値は変更しない）。これらの係数は旧 V0
  # モータモデル（D×V 電気 ODE）に対して同定したもので、bench_2026_10_15 の R_out
  # 駆動（duty→ロール角加速度ゲインの低さを既に再現する）と二重に効く。
  # オプトインのプラントプロファイル flip_fit_2026_10・生成物 sils_params::plant_fit::*・
  # *_fit シナリオは 2026-10-31 に削除した。本セットは記録としてのみ残す。
  # 飛んだとおりの失敗は、代わりにシナリオ flip_test2_repro で再現する。
  plant_fit_flip_2026_10:
    status: superseded
    superseded_by: bench_2026_10_15
    superseded_date: "2026-10-30"
    coupled: true
    params:
      torque_authority:
        value: 0.60
        unit: "-"
        method: "実機宙返りログ 1 本。開ループ最小二乗（duty→ODE→ロール角加速度）で 0.50±0.01、τ_cmd→α 回帰で 0.53、クローズドループ照合（SILS 掃引）で 0.55〜0.65 を採用"
        method_en: "One real flip log. Open-loop least squares (duty -> ODE -> roll acceleration) gives 0.50+-0.01, the tau_cmd -> alpha regression gives 0.53, closed-loop matching (SILS sweep) accepts 0.55-0.65"
        date: "2026-10-02"
        note: >
          ロール/ピッチ差動トルクの実効比（Plant::Config::torque_authority）。
          実機の duty→角加速度ゲインは SILS ODE プラントの約 0.5〜0.64 倍
          （2026-06 のホバー同定 b=65.4k 対 SILS ゲート 102.3k=0.64 とも整合）。
          単一ログ・ロール軸のみ。物理的原因（実効慣性・アーム長・推力-duty 勾配）は未分離。
      motor_delay_ms:
        value: 6.0
        unit: "ms"
        method: "実機宙返りログ 1 本。開ループ最小二乗で ODE の一次遅れに加えて 9〜10 ms。クローズドループ照合では、ホバー系の安定を保つ上限として 6 ms（スルーレートと組で）を採用"
        method_en: "One real flip log. Open-loop least squares gives 9-10 ms on top of the ODE lag. Closed-loop matching adopts 6 ms (paired with the slew limit) as the value that keeps the hover loops stable"
        date: "2026-10-02"
        note: >
          duty→推力経路の輸送遅れ（Plant::Config::motor_delay_ms、モータ ODE の
          手前に挿入）。宙返りの大信号では実機の duty→ジャイロ総遅れが約 33〜37 ms
          （ODE の約 16 ms ＋ 追加 約 17〜21 ms）だが、全部を遅れで入れると SILS の
          ホバー姿勢ループが追加 約 13 ms 以上で 6 Hz のリミットサイクルに入る（実機のホバーは
          安定。バックログ #15/#13、SILS に空力減衰が無いことが一因の疑い）。スルーレートと
          併用すると着陸中のロール振動が追加 7 ms 以上で出る（api_flight [27,33] s の傾き最大
          3.8°→9〜15°）ため、遅れは 6 ms に留め、残りを motor_slew_per_s に割り当てた。
      motor_slew_per_s:
        value: 18.0
        unit: "duty/s"
        method: "クローズドループ照合（SILS 掃引: 実機のトルク飽和区間・ピーク角速度・制動減速に合わせる）。実機ログへの開ループ強制適合ではスルーレートのみで 11.5 duty/s（残差 178 dps、遅れモデルは 110 dps）"
        method_en: "Closed-loop matching (SILS sweep to the real torque-saturation intervals, peak rate and brake deceleration). A forward open-loop fit to the real log with slew alone gives 11.5 duty/s (residual 178 dps vs 110 dps for the delay model)"
        date: "2026-10-02"
        note: >
          duty 指令のスルーレート制限（Plant::Config::motor_slew_per_s、輸送遅れの後段）。
          0→1 に約 56 ms かかる。ホバー近傍の小信号には効かず、宙返りのトルク飽和
          （duty が 0 と 1 の間を数十 ms で往復する）でだけ効く大信号限定の遅れ。
          物理的原因（ESC・ドライバ・電池の電流制限など）は未同定で、実効値である。
          遅れとスルーレートの分担は一意でない（1 本のログでは分離できない）。副作用として
          SILS の 200 Hz リミットサイクル（バックログ #12）の一部を抑え、yaw_hold の
          yaw_band が 8.0°→1.5°、calib が通る。実機ではこのチャタリングが残っているため、
          この抑制は実機と食い違う方向で、要再検討。
