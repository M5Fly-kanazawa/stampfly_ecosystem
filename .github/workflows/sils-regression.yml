# Run the SILS (Software-in-the-Loop) *.scn scenario regression suite on every
# change that could affect vehicle behavior, so the PASS documented in
# docs/contributing/release-workflow.md / TEST_MATRIX.md is verified by CI
# instead of relying on a developer's local machine.
# vehicle の挙動に影響しうる変更のたびに SILS の *.scn シナリオ退行スイートを
# 実行する。docs/contributing/release-workflow.md / TEST_MATRIX.md が記す PASS を
# 開発者のローカル環境任せにせず CI で検証する。
#
# The suite is `sf sils regression` (lib/sfcli/commands/sils.py): every *.scn under
# simulator/sils/scenarios/ that has a matching *.expect (32 as of 2026-07 — the
# glob is authoritative, the count may grow), each run with the invocation its own
# header comment documents (target/duration/--unpaired/...).
# スイートの実体は `sf sils regression`（lib/sfcli/commands/sils.py）:
# simulator/sils/scenarios/ 配下で *.expect を伴う全 *.scn（2026-07時点で32本 —
# グロブが正、本数は増えてよい）を、各自のヘッダコメントが宣言する呼び出し
# （target/duration/--unpaired 等）で実行する。
#
# No ESP-IDF is involved: the SILS host bench compiles the firmware sources
# directly with the system GCC via plain CMake (simulator/sils/CMakeLists.txt),
# fetching MuJoCo 3.9.0 as a source dependency (FetchContent, headless — no
# GLFW/OpenGL needed since SILS_MUJOCO_VIEWER defaults OFF). Confirmed by reading
# lib/sfcli/commands/sils.py: no esp-idf import/subprocess call anywhere in it.
# ESP-IDF は関与しない: SILS ホストベンチは firmware ソースをシステム GCC で
# 素の CMake から直接コンパイルする（simulator/sils/CMakeLists.txt）。MuJoCo
# 3.9.0 はソース依存として取得する（FetchContent、ヘッドレス —
# SILS_MUJOCO_VIEWER が既定 OFF のため GLFW/OpenGL 不要）。
# lib/sfcli/commands/sils.py を確認済み: esp-idf の import/subprocess 呼び出しは
# どこにも無い。
name: SILS scenario regression

on:
  push:
    branches: [main]
    paths: &sils_relevant_paths
      - 'firmware/**'
      - 'simulator/sils/**'
      - 'control/**'
      - 'lib/sfcli/**'
      - 'protocol/**'
      - '.github/workflows/sils-regression.yml'
  pull_request:
    paths: *sils_relevant_paths
  workflow_dispatch: # manual run (e.g. before tagging a release — versioning.md §5)

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No fetch-depth: 0: unlike release.yml's ESP-IDF build, the SILS host bench
        # embeds no `git describe` version string (grepped simulator/sils/CMakeLists.txt
        # and compat/ — no PROJECT_VER/GIT_DESCRIBE use), so the default shallow
        # checkout is enough.
        # fetch-depth: 0 は不要: release.yml の ESP-IDF ビルドと異なり、SILS
        # ホストベンチは `git describe` バージョン文字列を埋め込まない
        # （simulator/sils/CMakeLists.txt と compat/ を確認済み、
        # PROJECT_VER/GIT_DESCRIBE 未使用）。既定の shallow checkout で足りる。

      - name: Install build toolchain (gcc/g++, cmake, ninja)
        # build-essential provides gcc/g++/make (make is unused once Ninja is
        # selected below, but keeps this step self-contained if Ninja is ever
        # dropped). ninja is not on ubuntu-latest by default; `sf sils build`
        # (lib/sfcli/commands/sils.py run_build) now prefers it over the default
        # Unix Makefiles generator whenever it is on PATH, which meaningfully
        # speeds up the FetchContent MuJoCo build below.
        # build-essential で gcc/g++/make を導入（Ninja 選択後 make 自体は
        # 未使用だが、将来 Ninja をやめた場合に備え自己完結させる）。ninja は
        # ubuntu-latest に既定で無いため導入する。`sf sils build`
        # （lib/sfcli/commands/sils.py の run_build）は PATH に ninja があれば
        # 既定の Unix Makefiles より優先するようにした — 下の FetchContent
        # MuJoCo ビルドが有意に速くなる。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sf CLI
        # `pip install -e .` is the same install path documented throughout the
        # project (README, scripts/installer.py, release.yml's flasher_gui job).
        # No ESP-IDF setup step here — see the header comment above.
        #
        # pytest is installed separately (it is a [dev]-extra-only dependency,
        # not a base one — see pyproject.toml): `sf sils regression`
        # (run_regression's _check_pid_lockstep() gate, lib/sfcli/commands/
        # sils.py) shells out to `python3 -m pytest simulator/tests/
        # test_pid_lockstep.py` as its 3rd pre-scenario gate (PID lockstep —
        # firmware pid.hpp vs rate_sysid replay_pid Code Identity), so pytest
        # must be importable here or that gate fails before any scenario runs.
        # `pip install -e .` はプロジェクト全体で使われる導入方法と同じ
        # （README・scripts/installer.py・release.yml の flasher_gui ジョブ）。
        # ESP-IDF セットアップ手順はここには無い（冒頭コメント参照）。
        #
        # pytest は別途インストールする（pyproject.toml では base ではなく
        # [dev] extra 専用の依存）: `sf sils regression`（run_regression の
        # _check_pid_lockstep() ゲート、lib/sfcli/commands/sils.py）はシナリオ
        # 実行前の第3ゲートとして `python3 -m pytest simulator/tests/
        # test_pid_lockstep.py`（PID ロックステップ — ファーム pid.hpp と
        # rate_sysid replay_pid の Code Identity）を子プロセスで呼ぶため、
        # ここで pytest を import 可能にしておかないと全シナリオの前でこの
        # ゲートが失敗してしまう。
        run: |
          pip install -e .
          pip install "pytest>=7.0.0"
          sf --help >/dev/null

      - name: Check physical-parameter consistency
        # `sf sils regression` (lib/sfcli/commands/sils.py run_regression) already
        # runs this same check as its first step and fails the whole regression
        # if it doesn't pass — this standalone step is a fast-fail duplicate: a
        # hand-copied-parameter drift (tools/params_audit — C_T/C_Q/kappa/
        # inertia across firmware/SILS/simulator sources) is caught here in
        # seconds, before the multi-minute MuJoCo FetchContent build below runs
        # at all on a cache miss.
        #
        # `sf params generate --check` (Phase 1: spec YAML -> code generation,
        # see docs/architecture/simulation-policy.md) catches the OTHER half
        # of the same class of bug: someone edited control/models/
        # stampfly_physical.yaml (the physical-parameter SSOT) but forgot to
        # run `sf params generate`, so the generated copies
        # (tools/sysid/_generated_params.py, simulator/sils/plant/
        # generated_params.hpp, the docs marker table) are stale relative to
        # the YAML. `sf params check` alone would not catch this — the
        # generated files would still agree with EACH OTHER (both imported
        # from the same stale generated module), just not with the YAML.
        #
        # `sf sils regression`（lib/sfcli/commands/sils.py の run_regression）は
        # 同じ検査を自身の最初のステップとして既に実行し、不合格なら退行全体を
        # 失敗させる — 本ステップはそれを早期化する重複ステップ: 手動複製
        # パラメータの食い違い（tools/params_audit — C_T/C_Q/kappa/慣性等を
        # ファーム/SILS/シミュレータへ手書きコピー）を、下の MuJoCo FetchContent
        # ビルド（キャッシュミス時は数分かかる）を走らせる前に数秒で検出する。
        #
        # `sf params generate --check`（Phase 1: spec YAML→コード生成、
        # docs/architecture/simulation-policy.md 参照）は同種のバグのもう半分を
        # 検出する: control/models/stampfly_physical.yaml（物理パラメータの
        # SSOT）を編集したのに `sf params generate` を忘れたケース。生成物
        # （tools/sysid/_generated_params.py・simulator/sils/plant/
        # generated_params.hpp・docsマーカー表）は YAML から乖離していても
        # 互いには一致し続ける（同じ古い生成物から import しているため）ため、
        # `sf params check` だけでは検出できない。
        run: |
          sf params check --strict
          sf params generate --check

      - name: Cache SILS build directory (MuJoCo FetchContent + object files)
        # Caches the WHOLE build dir, not just _deps: actions/cache preserves file
        # mtimes on restore, so CMake/Ninja's own mtime-based staleness check still
        # forces a rebuild of anything that changed since the cache was written —
        # this is not just a MuJoCo-fetch cache, it is real incremental-build
        # caching. First run: no cache hit, MuJoCo 3.9.0 is fetched + built from
        # source (several minutes). Subsequent runs on an unchanged mujoco.cmake:
        # cache hit, only changed firmware/cores sources recompile (~seconds).
        # ビルドディレクトリ全体をキャッシュする（_deps だけではない）:
        # actions/cache は復元時にファイル mtime を保持するため、CMake/Ninja
        # 自身の mtime 差分ビルドが以後の変更分だけを再コンパイルする —
        # 単なる MuJoCo 取得キャッシュではなく実質的な差分ビルドキャッシュになる。
        # 初回はキャッシュ無しで MuJoCo 3.9.0 をソース取得・ビルド（数分）。
        # mujoco.cmake 無変更の再実行はキャッシュヒットし、変更のあった
        # firmware/cores ソースだけ再コンパイルされる（数秒程度）。
        uses: actions/cache@v4
        with:
          path: simulator/sils/build
          key: ubuntu-sils-build-${{ hashFiles('simulator/sils/cmake/mujoco.cmake') }}
          restore-keys: |
            ubuntu-sils-build-

      - name: Build the SILS host bench
        run: sf sils build

      - name: Run the SILS scenario regression suite
        id: sils_regression
        # `sf sils regression` runs every *.scn with a matching *.expect (32 as of
        # 2026-07) with the invocation each scenario's own header documents, and
        # exits non-zero if any fails — the job goes red on a real regression.
        # --json-out feeds the job-summary step below, which runs unconditionally
        # (if: always()) so a FAILing run still shows which scenario(s) broke.
        # `sf sils regression` は .expect を伴う全 *.scn（2026-07時点で32本）を
        # 各自のヘッダ宣言どおりに実行し、1つでも FAIL すれば非0で終了する —
        # 実際の退行があればジョブは赤くなる。--json-out は下のジョブサマリ
        # ステップへ渡す。サマリステップは常時実行（if: always()）のため、
        # FAIL 時もどのシナリオが壊れたか表示される。
        run: sf sils regression --json-out simulator/sils/viz/sils_regression_results.json

      - name: Write job summary
        if: always()
        # Renders simulator/sils/viz/sils_regression_results.json as a Markdown table
        # in the job summary. Runs unconditionally so a FAILing regression step
        # still shows which scenario(s) broke (see the script's own docstring for
        # why this is a standalone tools/ci/ script rather than a `sf` subcommand).
        # simulator/sils/viz/sils_regression_results.json をジョブサマリの表として
        # 描画する。常時実行のため退行ステップが FAIL してもどのシナリオが
        # 壊れたか表示される（`sf` サブコマンドでなく単体スクリプトにした理由は
        # スクリプト自身の docstring 参照）。
        run: python tools/ci/render_sils_summary.py simulator/sils/viz/sils_regression_results.json

      - name: Upload SILS bundles (debugging aid on failure)
        if: failure()
        # Only meaningful on a genuine scenario FAIL (not a build failure, which
        # leaves no bundles) — console.out/err + trajectory.csv + results.json per
        # scenario, the same artifacts `sf sils scenario` always writes locally.
        # シナリオが実際に FAIL した場合のみ意味を持つ（ビルド失敗ならバンドル
        # 自体が無い）— console.out/err・trajectory.csv・results.json は
        # `sf sils scenario` がローカルでも常に書き出す成果物と同じもの。
        uses: actions/upload-artifact@v4
        with:
          name: sils-regression-bundles
          path: simulator/sils/viz/out_scn_*/
          if-no-files-found: ignore
