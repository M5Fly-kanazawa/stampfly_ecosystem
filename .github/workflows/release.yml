# Build vehicle/controller firmware and attach flashable binaries to a
# GitHub Release when a version tag is pushed.
# vehicle・controllerファームウェアをビルドし、バージョンタグをpushしたときに
# 書き込み可能なバイナリを GitHub Release へ添付するワークフロー。
#
# Trigger / 起動条件:
#   - push tag 'v*' (e.g. v2026.07.0, see docs/contributing/versioning.md)
#     -> build both targets AND create a GitHub Release
#     'v*' 形式のタグをpushすると両ターゲットをビルドし、Releaseを作成する
#   - workflow_dispatch
#     -> build both targets only, no Release is created (build verification run)
#     手動実行はビルド確認のみ。Releaseは作成しない
#
# Versioning policy / バージョニング規約: docs/contributing/versioning.md
name: Release firmware binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual build-only run / 手動でのビルド確認実行

permissions:
  contents: write # required to create a Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [vehicle, controller]
        # Map each firmware target to its ESP-IDF app binary filename
        # (derived from each project's CMake project name).
        # 各ターゲットのアプリbin名（CMakeのproject名に由来）を対応付ける
        include:
          - target: vehicle
            app_bin: stampfly_vehicle.bin
          - target: controller
            app_bin: firmware_controller.bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ESP-IDF embeds PROJECT_VER from `git describe`, so full history
          # (including tags) must be available.
          # ESP-IDF は git describe から PROJECT_VER を埋め込むため全履歴が必要
          fetch-depth: 0

      - name: Build ${{ matrix.target }} and merge into a single flashable image
        # merge_bin combines bootloader + partition table + app (+ OTA data for
        # controller) into one image starting at offset 0x0, so it can be
        # written directly with M5Burner, a web flasher, or
        # `esptool.py write_flash 0x0`.
        # merge_bin は bootloader・パーティションテーブル・app(・controllerは
        # OTAデータ) を 0x0 起点の単一binへ結合し、M5Burner・Webフラッシャ・
        # `esptool.py write_flash 0x0` でそのまま書き込めるようにする
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          command: cd firmware/${{ matrix.target }} && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o merged_full.bin @flash_args

      - name: Determine release identifier
        id: rel
        # Tag push -> use the tag name. workflow_dispatch -> use the short SHA
        # so build-verification artifacts still get a stable, unique name.
        # タグpush時はタグ名、手動実行時は短縮SHAを識別子として使う
        # Use default env vars (not ${{ }} interpolation) so shellcheck can
        # analyze the comparison and no expression is injected into the script.
        # ${{ }} 展開ではなく既定の環境変数を使う（shellcheck が比較を解析でき、
        # 式のスクリプト注入も避けられる）
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "rel=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "rel=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts into dist/
        # Build outputs are owned by root (produced inside the ESP-IDF
        # container) but remain readable, so a plain `cp` is enough; avoid
        # moving/deleting files under the build directory.
        # ビルド成果物はコンテナ内で root 所有になるが読み取りは可能なため
        # cp のみを使い、ビルドディレクトリの移動・削除は行わない
        run: |
          REL="${{ steps.rel.outputs.rel }}"
          mkdir -p dist
          cp firmware/${{ matrix.target }}/build/merged_full.bin \
            "dist/stampfly_${{ matrix.target }}_${REL}_full.bin"
          cp "firmware/${{ matrix.target }}/build/${{ matrix.app_bin }}" \
            "dist/stampfly_${{ matrix.target }}_${REL}_app.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/

  flasher_gui:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish even if one fails, so a single flaky leg
      # doesn't cancel the others and each run reports full per-OS signal.
      # 1つのOSが失敗しても他のOSを最後まで走らせ、実行ごとに全OS分の
      # 結果が得られるようにする（巻き添えキャンセルを防ぐ）
      fail-fast: false
      matrix:
        # Each entry pairs a GitHub-hosted runner OS with the artifact suffix
        # used in the packaged filename; no cross product with another key
        # is needed, so `include` alone defines the full matrix.
        # 各エントリはGitHub提供ランナーのOSと、パッケージ名に使うsuffixを
        # 対応付ける。他キーとの直積は不要なため include だけでマトリクス全体を
        # 定義する
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x64
          - os: ubuntu-latest
            suffix: linux-x64
    defaults:
      run:
        # Force bash even on the Windows runner (whose default shell is
        # pwsh) so the same script runs unmodified on every matrix OS.
        # Windowsランナー（既定シェルはpwsh）でもbashを強制し、同一スクリプトを
        # 全マトリクスOSでそのまま使い回せるようにする
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Unlike the ESP-IDF build, the GUI app does not embed a
        # `git describe` version string, so fetch-depth: 0 is not needed.
        # ESP-IDFビルドと異なりGUIアプリはgit describeのバージョン文字列を
        # 埋め込まないため、fetch-depth: 0 は不要

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        # PyInstaller 7 turns the --onefile + --windowed combination used
        # below into a hard error on macOS (currently only a deprecation
        # warning), so pin to the 6.x series until the macOS packaging is
        # reworked.
        # PyInstaller 7では下記で使う --onefile + --windowed の組み合わせが
        # macOSでエラーになる（現状は非推奨警告のみ）ため、macOS向け
        # パッケージングを作り直すまでは6.x系に固定する
        run: pip install "esptool>=5,<6" "pyinstaller>=6,<7"

      - name: Smoke-test the app entry point
        # Cheap sanity check (no GUI, no hardware) before spending time on a
        # PyInstaller build. Also the first place a missing Tk/tkinter on
        # the ubuntu-latest runner would surface: actions/setup-python's
        # CPython builds bundle tcl/tk, so this is expected to pass as-is;
        # if it ever fails with a Tkinter import error on Linux, the fix is
        # `sudo apt-get install -y python3-tk` as an extra step before this
        # one (not currently needed).
        # PyInstallerビルドに時間をかける前の簡易確認（GUIもハードウェアも
        # 使わない）。ubuntu-latestランナーでTk/tkinterが欠けている場合も
        # まずここで顕在化する: actions/setup-pythonのCPythonビルドは
        # tcl/tkを同梱しているため現状は素通りする想定。もしLinuxで
        # Tkinterのimportエラーが出た場合は、このステップの前に
        # `sudo apt-get install -y python3-tk` を追加するのが対処法
        # （現時点では不要）
        run: python tools/flasher_gui/stampfly_flasher.py --version

      - name: Build with PyInstaller
        # --windowed suppresses the console window on Windows and, on macOS,
        # produces a StampFlyFlasher.app bundle instead of a bare binary.
        # On Linux, --windowed is a documented no-op (PyInstaller has no
        # windowed/console distinction there), so the same command line
        # still produces a single-file binary.
        # --collect-data esptool bundles esptool's flasher-stub JSON files
        # (esptool/targets/stub_flasher/**.json). esptool loads them by a
        # path relative to __file__ and ships no PyInstaller hook for them,
        # so without this flag the frozen app fails with FileNotFoundError
        # on esp32s3.json the moment a real flash starts.
        # --icon embeds the app icon; PyInstaller ignores --icon on Linux
        # onefile ELF binaries (no icon resource format to embed into), so
        # it is only passed for Windows/macOS.
        # --windowed はWindowsでコンソールウィンドウを抑制し、macOSでは単体の
        # バイナリではなく StampFlyFlasher.app バンドルを生成する。
        # Linuxでは --windowed は仕様上no-op（windowed/consoleの区別が
        # 存在しない）で、同じコマンド行のまま単一ファイルのバイナリになる
        # --collect-data esptool は esptool のフラッシャースタブJSONファイル
        # （esptool/targets/stub_flasher/**.json）を同梱する。esptoolは
        # __file__相対パスでこれを読み込み、PyInstaller用フックを同梱して
        # いないため、このフラグがないと実際の書き込み開始時に
        # esp32s3.jsonでFileNotFoundErrorになる
        # --icon はアプリアイコンを埋め込む。PyInstallerはLinuxのonefile
        # ELFバイナリでは --icon を無視する（埋め込み先のアイコンリソース
        # 形式が存在しないため）ため、Windows/macOSのみに付与する
        run: |
          ICON_ARGS=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ICON_ARGS=(--icon tools/flasher_gui/assets/icon.ico)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ICON_ARGS=(--icon tools/flasher_gui/assets/icon.icns)
          fi
          pyinstaller --onefile --windowed --collect-data esptool \
            "${ICON_ARGS[@]}" \
            --name StampFlyFlasher tools/flasher_gui/stampfly_flasher.py

      - name: Smoke-test the frozen binary
        # The step's bash pipes are inherited by the app as std handles
        # even in the --windowed build, so --version/--selftest output
        # is visible in this log. timeout-minutes is a guard rail: if
        # the frozen app ever hangs again (e.g. a stray modal dialog
        # from PyInstaller's bootloader, as in the first v2026.07.1
        # Windows run), the step fails within minutes instead of
        # stalling until the 6-hour job limit. --selftest also reaches
        # the network (GitHub API + a ~1.2MB download), which hosted
        # runners allow.
        # このステップの bash のパイプは --windowed ビルドでもアプリに
        # 標準ハンドルとして継承されるため、--version/--selftest の出力は
        # このログで見える。timeout-minutes は防護柵で、frozen アプリが
        # 再びハングした場合(例: v2026.07.1 初回の Windows 実行で起きた
        # PyInstaller bootloader のモーダルダイアログ)でも、6時間の
        # ジョブ上限まで停滞せず数分で失敗させる。--selftest は
        # ネットワーク(GitHub API + 約1.2MBのダウンロード)にもアクセス
        # するが、ホスト型ランナーでは許可されている。
        #
        # GITHUB_TOKEN makes the app's GitHub API call authenticated: hosted
        # runners share egress IPs, so anonymous calls are frequently
        # rate-limited (observed: HTTP 403 on the v2026.07.1 first run).
        # GITHUB_TOKEN によりアプリの GitHub API 呼び出しを認証付きにする。
        # ホスト型ランナーは送信元IPを共有するため匿名呼び出しはレート制限に
        # 掛かりやすい（v2026.07.1 初回実行で HTTP 403 を実際に観測）
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./dist/StampFlyFlasher.exe"
          else
            # macOS: the bare onefile binary, not the .app bundle that
            # --windowed also produces (the bundle just wraps this same
            # executable). Linux: --windowed is a no-op there (see the
            # PyInstaller build step above), so it is likewise the plain
            # onefile binary with no bundle wrapper to begin with.
            # macOS: --windowed が生成する .app バンドルではなく単体の
            # onefileバイナリを使う（バンドルは同じ実行ファイルを包むだけ）。
            # Linux: --windowed はno-op（上のPyInstallerビルドステップ参照）
            # のため、そもそもバンドルで包まれない単体のonefileバイナリになる
            BIN="./dist/StampFlyFlasher"
          fi
          "$BIN" --version
          "$BIN" --selftest

      - name: Determine release identifier
        id: rel
        # Duplicated from the `build` job on purpose: this job runs in
        # parallel with `build` (no `needs`), and jobs cannot share step
        # outputs without explicit `needs` + output wiring. Keep this logic
        # identical to the `build` job's so both agree on naming.
        # `build` ジョブと意図的に重複させている。本ジョブは build と並列実行
        # （needs なし）し、ジョブ間で step output を共有するには明示的な
        # needs + output 配線が必要なため。命名を両ジョブで一致させるため
        # ロジックは build ジョブと同一に保つこと
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "rel=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "rel=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: |
          REL="${{ steps.rel.outputs.rel }}"
          mv dist/StampFlyFlasher.exe "dist/StampFlyFlasher_${REL}_${{ matrix.suffix }}.exe"

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        # ditto -c (create) -k (zip format) --keepParent preserves
        # StampFlyFlasher.app as a single top-level bundle; a plain `zip`
        # would mangle the bundle's symlinks and resource forks.
        # ditto -c（作成）-k（zip形式）--keepParent は StampFlyFlasher.app を
        # トップレベル単一バンドルのまま保持する。通常の zip だとバンドル内の
        # シンボリックリンクやリソースフォークが壊れる
        run: |
          REL="${{ steps.rel.outputs.rel }}"
          ditto -c -k --keepParent dist/StampFlyFlasher.app \
            "dist/StampFlyFlasher_${REL}_${{ matrix.suffix }}.zip"

      - name: Package Linux executable
        if: runner.os == 'Linux'
        # No zip/bundle step needed: the PyInstaller --onefile output is
        # already a single self-contained ELF binary. chmod +x because the
        # bit is not guaranteed to survive upload-artifact -> download
        # unpacking on the consuming side (e.g. a user's `curl` download).
        # zip/バンドル化は不要: PyInstaller --onefile の出力は既に単一の
        # 自己完結ELFバイナリ。chmod +x するのは、実行ビットが
        # upload-artifact -> ダウンロード側の展開（例: ユーザーのcurl
        # ダウンロード）で保持される保証がないため
        run: |
          REL="${{ steps.rel.outputs.rel }}"
          mv dist/StampFlyFlasher "dist/StampFlyFlasher_${REL}_${{ matrix.suffix }}"
          chmod +x "dist/StampFlyFlasher_${REL}_${{ matrix.suffix }}"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flasher-gui-${{ matrix.suffix }}
          path: dist/*.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: flasher-gui-${{ matrix.suffix }}
          path: dist/*.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        # No extension on this asset (see "Package Linux executable"
        # above), so the glob is prefix-based instead of extension-based
        # like the Windows/macOS uploads.
        # このアセットには拡張子がない（上の"Package Linux executable"
        # 参照）ため、Windows/macOSのアップロードのような拡張子ベースでは
        # なくプレフィックスベースのglobにする
        uses: actions/upload-artifact@v4
        with:
          name: flasher-gui-${{ matrix.suffix }}
          path: dist/StampFlyFlasher_*_linux-x64

      # --- GUI Flasher native-install smoke test (Windows/macOS/Linux) ---
      # This exercises lib/sfcli/utils/flasher_install/ end-to-end against
      # the artifact just built above, on every OS that ships one — not
      # a separate job, so it reuses this job's already-built `dist/`
      # artifact and Python environment instead of re-downloading/rebuilding.
      # --- GUIフラッシャ ネイティブインストールのスモークテスト
      #     (Windows/macOS/Linux) ---
      # 上でビルドしたばかりの成果物に対し、それを配布する全OS上で
      # lib/sfcli/utils/flasher_install/ をエンドツーエンドで検証する。
      # 別ジョブにはせず、本ジョブが既にビルド済みの `dist/` 成果物と
      # Python環境をそのまま再利用する（再ダウンロード・再ビルドしない）

      - name: Install sfcli (for the flasher install smoke test)
        # Installs sfcli into the same Python environment already used to
        # build the frozen app (actions/setup-python's 3.12), mirroring
        # scripts/installer.py's Step 3/4 (`pip install -e .`). This is a
        # plain venv-less runner environment, so no ESP-IDF venv resolution
        # is needed here (unlike installer.py's _run_in_idf_env()).
        # フローズンアプリのビルドに使ったのと同じPython環境
        # (actions/setup-pythonの3.12)にsfcliをインストールする。
        # scripts/installer.py のStep3/4 (`pip install -e .`)を模す。
        # ここはvenvなしの素のランナー環境のため、installer.pyの
        # _run_in_idf_env()のようなESP-IDF venv解決は不要
        timeout-minutes: 10
        run: |
          pip install -e .
          sf --help >/dev/null

      - name: Run flasher-install pure-logic tests
        # Dependency-free, network-free logic tests: platform_key
        # detection, asset-name matching, SHA256 verification, manifest
        # read/write/uninstall-target enumeration.
        # 依存なし・ネットワークなしのロジックテスト: platform_key判定・
        # 資産名マッチング・SHA256照合・manifest読み書き/アンインストール
        # 対象列挙
        run: python tools/ci/check_flasher_install.py

      - name: Run sf-upgrade logic tests
        # Offline 6-case harness for `sf upgrade` (bare-remote + clone
        # fixtures, pip stubbed): clean ff, stash preserve, stash-pop
        # conflict guidance, dependency-resync reach, sdkconfig staleness
        # backup, --discard-local. Runs on every leg so the git-invoking
        # code is exercised on Windows shells too.
        # `sf upgrade` のオフライン6ケーステスト（bareリモート+クローンの
        # fixture、pipはスタブ）: クリーンff・stash保全・stash pop衝突案内・
        # 依存同期到達・sdkconfig陳腐化退避・--discard-local。git呼び出しを
        # Windowsシェルでも検証するため全レッグで実行する
        timeout-minutes: 10
        run: python tools/ci/check_upgrade.py

      - name: Install GUI Flasher from the just-built artifact (install smoke test)
        # --from-file bypasses the GitHub Releases API lookup entirely
        # (there is no release yet on a workflow_dispatch/build-verification
        # run), installing directly from this job's own dist/ output.
        # --from-file は GitHub Releases API の参照を完全に迂回する
        # （workflow_dispatch/ビルド確認実行時点ではまだReleaseが存在
        # しない）。本ジョブ自身のdist/出力から直接インストールする
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARTIFACT=$(ls dist/*.exe)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ARTIFACT="dist/StampFlyFlasher.app"
          else
            ARTIFACT=$(ls dist/StampFlyFlasher_*_linux-x64)
          fi
          echo "Installing from: $ARTIFACT"
          sf flasher install --from-file "$ARTIFACT" --yes

      - name: Assert flasher install artifacts exist (install smoke test)
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -e "$LOCALAPPDATA/Programs/StampFly/StampFlyFlasher.exe" \
              || { echo "FAIL: installed exe missing"; exit 1; }
            test -e "$APPDATA/Microsoft/Windows/Start Menu/Programs/StampFly/StampFly Flasher.lnk" \
              || { echo "FAIL: Start Menu shortcut missing"; exit 1; }
            test -e "$LOCALAPPDATA/Programs/StampFly/uninstall.cmd" \
              || { echo "FAIL: uninstall.cmd missing"; exit 1; }
            reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\StampFlyFlasher" \
              || { echo "FAIL: Apps & features (Uninstall) registry entry missing"; exit 1; }
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            test -x "$HOME/Applications/StampFlyFlasher.app/Contents/MacOS/StampFlyFlasher" \
              || { echo "FAIL: installed app executable missing"; exit 1; }
          else
            test -x "$HOME/.local/opt/stampfly/StampFlyFlasher" \
              || { echo "FAIL: installed binary missing"; exit 1; }
            test -e "$HOME/.local/share/applications/stampfly-flasher.desktop" \
              || { echo "FAIL: .desktop entry missing"; exit 1; }
            test -e "$HOME/.local/share/icons/hicolor/256x256/apps/stampfly-flasher.png" \
              || { echo "FAIL: installed icon missing"; exit 1; }
          fi
          echo "OK: install artifacts verified"

      - name: Uninstall GUI Flasher (install smoke test)
        timeout-minutes: 5
        run: sf flasher uninstall --yes

      - name: Assert flasher uninstall removed all artifacts (install smoke test)
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test ! -e "$LOCALAPPDATA/Programs/StampFly/StampFlyFlasher.exe" \
              || { echo "FAIL: exe still present after uninstall"; exit 1; }
            test ! -e "$APPDATA/Microsoft/Windows/Start Menu/Programs/StampFly/StampFly Flasher.lnk" \
              || { echo "FAIL: Start Menu shortcut still present after uninstall"; exit 1; }
            if reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\StampFlyFlasher" >/dev/null 2>&1; then
              echo "FAIL: Apps & features registry entry still present after uninstall"
              exit 1
            fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            test ! -e "$HOME/Applications/StampFlyFlasher.app" \
              || { echo "FAIL: app bundle still present after uninstall"; exit 1; }
          else
            test ! -e "$HOME/.local/opt/stampfly/StampFlyFlasher" \
              || { echo "FAIL: binary still present after uninstall"; exit 1; }
            test ! -e "$HOME/.local/share/applications/stampfly-flasher.desktop" \
              || { echo "FAIL: .desktop entry still present after uninstall"; exit 1; }
          fi
          echo "OK: uninstall verified clean"

      - name: Exercise uninstall.cmd (Windows Apps-and-features path)
        if: runner.os == 'Windows'
        # The registry's UninstallString points at uninstall.cmd — the path
        # Windows "Apps & features" actually runs, and the only piece of the
        # installer that `sf flasher uninstall` (tested above) does NOT
        # exercise. Re-install, run the .cmd the way Windows would, wait out
        # its delayed self-delete (2s + margin), then assert everything is
        # gone — including the install directory the script removes last.
        # レジストリの UninstallString は uninstall.cmd を指す — Windows の
        # 「アプリと機能」が実際に実行する経路で、上でテスト済みの
        # `sf flasher uninstall` が通らない唯一のコード。再インストールし、
        # Windows と同じ方法で .cmd を実行、遅延自己削除(2秒+余裕)を待って
        # から、スクリプトが最後に消すインストールディレクトリまで含めて
        # 全て消えたことをアサートする。
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARTIFACT=$(ls dist/*.exe)
            sf flasher install --from-file "$ARTIFACT" --yes
            cmd //c "$LOCALAPPDATA\\Programs\\StampFly\\uninstall.cmd"
            sleep 8
            test ! -e "$LOCALAPPDATA/Programs/StampFly" \
              || { echo "FAIL: install dir still present after uninstall.cmd"; exit 1; }
            test ! -e "$APPDATA/Microsoft/Windows/Start Menu/Programs/StampFly/StampFly Flasher.lnk" \
              || { echo "FAIL: Start Menu shortcut still present after uninstall.cmd"; exit 1; }
            if reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\StampFlyFlasher" >/dev/null 2>&1; then
              echo "FAIL: registry entry still present after uninstall.cmd"
              exit 1
            fi
            echo "OK: uninstall.cmd verified clean"
          fi

  release:
    # Wait for both matrix jobs so every artifact (firmware bins + the
    # per-OS flasher GUI packages) exists before download-artifact runs.
    # 両方のマトリクスジョブを待つ（download-artifact 実行前に、ファーム
    # バイナリとOSごとのGUIフラッシャパッケージが両方揃っている必要がある）
    needs: [build, flasher_gui]
    # Only tags arriving via `git push` create a Release; a workflow_dispatch
    # run on a tag ref must stay build-only (see header comment).
    # Release を作るのは push されたタグのみ。タグ ref 上での手動実行は
    # ビルド確認に留める（冒頭コメントの方針どおり）
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Job-level permissions override the workflow-level ones, so
    # contents: write must be repeated here alongside actions: write.
    # ジョブレベルの permissions はワークフローレベルを上書きするため、
    # actions: write と併せて contents: write もここに再掲する。
    permissions:
      contents: write # create the Release and upload assets / Release作成とアセット添付
      actions: write # dispatch the Pages redeploy step below / 下のPages再デプロイ起動用
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.bin
            dist/*.exe
            dist/*.zip
            dist/StampFlyFlasher_*_linux-x64
            dist/SHA256SUMS.txt
          body: |
            ## 書き込み方法 / How to flash

            `full` は bootloader + パーティションテーブル + app（controllerはOTAデータも含む）を
            結合した工場出荷相当のイメージで、0x0 から一括書き込みする。`app` はアプリ本体のみ。
            `full` bundles bootloader + partition table + app (+ OTA data for controller) into a
            factory-equivalent image flashed from offset 0x0. `app` contains only the application.

            GUI派・ビルド不要な場合は、`StampFlyFlasher_<tag>_windows-x64.exe` /
            `_macos-arm64.zip`（Apple Silicon）/ `_macos-x64.zip`（Intel）/
            `_linux-x64`（`chmod +x` してから実行）をダウンロードして実行する
            （macOSは初回のみ右クリック→「開く」で起動。Gatekeeper対策）。
            すでに `sf` が使える環境では `sf flasher install` でアプリとして
            インストールし、ショートカット/ランチャー登録まで自動で行うことも
            できる。
            Web flasher: https://m5fly-kanazawa.github.io/stampfly_ecosystem/flash/
            （macOSのChromeには既知のクラッシュ問題があるため、デスクトップ版を推奨）。
            Prefer a GUI with no build step? Download and run
            `StampFlyFlasher_<tag>_windows-x64.exe` / `_macos-arm64.zip` (Apple Silicon) /
            `_macos-x64.zip` (Intel) / `_linux-x64` (run `chmod +x` first) (on macOS,
            right-click -> Open the first time to bypass Gatekeeper). If `sf` is already
            set up, `sf flasher install` installs it as a native app (with shortcuts /
            launcher registration) instead.
            Web flasher: https://m5fly-kanazawa.github.io/stampfly_ecosystem/flash/
            (a known crash issue affects Chrome on macOS -> the desktop app is recommended).

            ```bash
            # Flash everything from scratch / 工場出荷相当で全体を書き込む
            esptool.py --chip esp32s3 write_flash 0x0 stampfly_vehicle_<tag>_full.bin

            # Or build & flash the app from source with the sf CLI
            # または sf CLI でソースからビルド・書き込み
            sf build vehicle && sf flash vehicle
            ```

      - name: Redeploy the site so the web flasher serves this release
        # deploy-pages.yml has a `release: published` trigger, but events
        # caused by GITHUB_TOKEN never fire other workflows (GitHub's
        # recursion guard), and the release above IS created with
        # GITHUB_TOKEN — so that trigger never fires for this job.
        # Calling the workflow_dispatch API directly is the documented
        # exception that does work with GITHUB_TOKEN (it needs the
        # job-level `actions: write` permission above). Observed on
        # v2026.07.1: the web flasher kept serving v2026.07.0 firmware
        # until a manual redeploy.
        # deploy-pages.yml には `release: published` トリガがあるが、
        # GITHUB_TOKEN 起因のイベントは他のワークフローを発火させない
        # （GitHub の再帰防止仕様）。上のリリースはまさに GITHUB_TOKEN で
        # 作成されるため、このジョブではそのトリガは決して発火しない。
        # workflow_dispatch API の直接呼び出しはこの抑止の例外として
        # GITHUB_TOKEN でも機能する（上のジョブレベル `actions: write`
        # 権限が必要）。v2026.07.1 で実際に観測: 手動で再デプロイする
        # まで Web フラッシャは v2026.07.0 のファームを配信し続けた。
        #
        # This job has no checkout, so gh cannot infer the repo from git;
        # pass it explicitly via the default GITHUB_REPOSITORY env var.
        # このジョブは checkout していないため gh は git からリポジトリを
        # 推定できない。既定の環境変数 GITHUB_REPOSITORY で明示する。
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
