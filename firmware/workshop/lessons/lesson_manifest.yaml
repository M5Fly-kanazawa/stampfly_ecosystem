# Lesson Manifest — Single Source of Truth for lesson ordering
# レッスンマニフェスト — レッスン順序の唯一の情報源
#
# `slide_file` (below) names a chapter without its extension, resolved by
# `sf doctor` and tools/extract_snippets.py against
# docs/events/stampfly_workshop/slides/chapters/<slide_file>.tex.
# 下記の `slide_file` は拡張子なしのチャプター名で、`sf doctor` と
# tools/extract_snippets.py がdocs/events/stampfly_workshop/slides/chapters/<slide_file>.tex
# として解決する。
#
# Optional field: has_solution (bool, default: true)
# レッスンにsolution.cppを必須としない場合はhas_solution: falseを設定する
# Set has_solution: false for lessons that have no "correct answer" by
# design (e.g. open-ended event templates) — this suppresses the
# solution.cpp check in `sf doctor` and `sf lesson switch/solution --solution`.
# 設計上「正解」が存在しないレッスン（イベント用の自由課題テンプレート等）に
# 設定する。`sf doctor` と `sf lesson switch/solution --solution` の
# solution.cppチェックを省略する。省略時はtrue扱い（solution.cpp必須）。
#
# Top-level `courses:` field (optional) — event-specific orderings
# Event templates (e.g. a one-day tutorial that walks through existing
# lessons in a different order) do NOT need a new lesson_9X directory.
# Instead, add an entry under `courses:` below: it maps a tutorial-local
# step number onto an existing lesson id, so `sf lesson switch <id>:<N>`
# resolves to the real lesson and no firmware directory is copied per
# event. Reserve `lesson_9X` directories under `lessons:` for content
# that has no existing-lesson equivalent (e.g. Lesson 90's onboard-button
# duty exercise below).
# トップレベルの `courses:` フィールド（任意）— イベント固有の順序付け
# イベント（例: 既存レッスンを別順序で辿る1日チュートリアル）を追加する
# のに、新しい lesson_9X ディレクトリは不要。代わりに下記の `courses:`
# にエントリを追加する — チュートリアル固有のステップ番号を既存の
# レッスンidへ対応付けるだけなので、`sf lesson switch <id>:<N>` が実体の
# レッスンへ解決され、イベントごとにファームウェアディレクトリを
# コピーする必要がない。`lessons:` 配下の `lesson_9X` ディレクトリは、
# 既存レッスンに相当するものがない本当に新規のコンテンツ専用として
# 予約する（例: 下記 Lesson 90 のオンボードボタンduty実習）。

lessons:
  # === Day 1 ===
  - number: 0
    id: environment_setup
    title_ja: 環境セットアップ
    title_en: Environment Setup
    description_ja: ESP-IDF環境構築、ビルド・書き込み・モニタの基本
    description_en: ESP-IDF setup, build/flash/monitor basics
    firmware_dir: lesson_00_setup
    slide_file: environment_setup

  - number: 1
    id: motor_control
    title_ja: モータ制御
    title_en: Motor Control
    description_ja: PWMデューティ比によるモータ制御、ARM/DISARM
    description_en: Motor control via PWM duty cycle, arm/disarm
    firmware_dir: lesson_01_motor
    slide_file: motor_control

  - number: 2
    id: controller_input
    title_ja: コントローラ入力
    title_en: Controller Input
    description_ja: ESP-NOW無線通信、RCスティック値、オープンループ制御
    description_en: ESP-NOW wireless, RC stick values, open-loop control
    firmware_dir: lesson_02_controller
    slide_file: controller_input

  # === Day 2 ===
  - number: 3
    id: led_control
    title_ja: LED制御
    title_en: LED Control
    description_ja: システム状態をLEDで可視化、バッテリー電圧表示
    description_en: Visualize system state with LED, battery voltage display
    firmware_dir: lesson_03_led
    slide_file: led_control

  - number: 4
    id: imu_sensor
    title_ja: IMUセンサー
    title_en: IMU Sensor
    description_ja: 加速度・ジャイロセンサーの読み取りとデータ解釈
    description_en: Accelerometer and gyroscope reading and data interpretation
    firmware_dir: lesson_04_imu
    slide_file: imu_sensor

  - number: 5
    id: rate_p_control
    title_ja: レートP制御 + 初フライト
    title_en: Rate P-Control + First Flight
    description_ja: ジャイロフィードバックによるP制御、初めてのフライト
    description_en: Gyro feedback P-control, first flight
    firmware_dir: lesson_05_p_control
    slide_file: rate_p_control

  # === Day 3 ===
  - number: 6
    id: system_modeling
    title_ja: システムモデリング
    title_en: System Modeling
    description_ja: 伝達関数の導出、ブロック図、制御系設計の基礎
    description_en: Transfer function derivation, block diagrams, control design basics
    firmware_dir: lesson_06_modeling
    slide_file: system_modeling

  - number: 7
    id: system_identification
    title_ja: システム同定
    title_en: System Identification
    description_ja: フライトデータからモデルパラメータを推定・検証
    description_en: Estimate and validate model parameters from flight data
    firmware_dir: lesson_07_sysid
    slide_file: system_identification

  - number: 8
    id: pid_control
    title_ja: PID制御
    title_en: PID Control
    description_ja: モデルに基づくI/D項の追加で制御性能を改善
    description_en: Improve control with model-based I/D term addition
    firmware_dir: lesson_08_pid
    slide_file: pid_control

  # === Day 4 ===
  - number: 9
    id: attitude_estimation
    title_ja: 姿勢推定
    title_en: Attitude Estimation
    description_ja: 相補フィルタ・センサフュージョンで角度を推定
    description_en: Estimate angles with complementary filter and sensor fusion
    firmware_dir: lesson_09_estimation
    slide_file: attitude_estimation

  - number: 10
    id: api_reference
    title_ja: "ws:: APIリファレンス"
    title_en: "ws:: API Reference"
    description_ja: ワークショップAPI全関数の解説と使用例
    description_en: Complete reference and examples for workshop API
    firmware_dir: lesson_10_api_overview
    slide_file: api_reference

  - number: 11
    id: custom_firmware
    title_ja: 独自ファームウェア開発
    title_en: Custom Firmware Development
    description_ja: "ws:: APIを組み合わせたオリジナルファームウェアの作成"
    description_en: "Build original firmware combining ws:: APIs"
    firmware_dir: ~
    slide_file: custom_firmware

  - number: 12
    id: python_sdk
    title_ja: Python SDK プログラム飛行
    title_en: Python SDK Programmatic Flight
    description_ja: Python SDKによる自動飛行プログラムの作成
    description_en: Create autonomous flight programs with Python SDK
    firmware_dir: lesson_12_python_sdk
    slide_file: python_sdk

  # === Day 5 ===
  - number: 13
    id: precision_landing
    title_ja: 精密着陸競技会
    title_en: Precision Landing Competition
    description_ja: ホバリング精度と着陸精度を競う競技会
    description_en: Competition for hovering and landing precision
    firmware_dir: lesson_13_competition
    slide_file: precision_landing

  # === Events / 教育イベント（通常レッスンとは別系統の実習テンプレート） ===
  # Event templates live at number >= 90, but ONLY for genuinely new
  # content with no existing-lesson equivalent (e.g. Lesson 90 below).
  # An event that reuses existing lessons in a different order (e.g. a
  # one-day tutorial) does not belong here — declare it under the
  # top-level `courses:` field instead (see header comment above).
  # イベント用テンプレートは90番以降だが、既存レッスンに相当するものが
  # ない本当に新規のコンテンツにのみ使う（例: 下記 Lesson 90）。既存
  # レッスンを別順序で再利用するイベント（1日チュートリアル等）はここに
  # 追加せず、トップレベルの `courses:` フィールドに宣言する
  # （上記ヘッダーコメント参照）。
  - number: 90
    id: dxh_workshop
    title_ja: DXH高校の先生向け体験講座
    title_en: DXH Teacher Workshop
    description_ja: モータDuty書き換え実習（機体ボタンARM・duty上限0.15）
    description_en: Motor duty exercise (onboard-button arm, duty cap 0.15)
    firmware_dir: lesson_90_dxh_workshop
    # Event template: participants rewrite the duty value on the day, so
    # there is no single "correct answer" — no solution.cpp is provided.
    # イベント用テンプレート: 当日参加者がduty値を書き換える実習のため
    # 唯一の「正解」が存在しない。solution.cppは提供しない。
    has_solution: false

# === Courses / コース（イベント固有のレッスン順序） ===
# A course maps a tutorial-local step number onto an existing lesson id
# (via its `lesson:` field) — it never introduces new firmware content.
# Resolve a step with `sf lesson switch <course id>:<N>` (also works for
# `solution`/`info`), or browse steps with `sf lesson list --course <id>`.
# コースは、チュートリアル固有のステップ番号を（`lesson:` フィールド経由で）
# 既存レッスンidへ対応付けるだけで、新しいファームウェア内容は導入しない。
# ステップの解決は `sf lesson switch <コースid>:<N>`（`solution`/`info`も
# 同様）、閲覧は `sf lesson list --course <id>` で行う。
courses:
  - id: sci2026
    title_ja: SCI/SICE チュートリアル講座 2026
    title_en: SCI/SICE Tutorial 2026
    steps:
      - number: 1
        lesson: environment_setup      # Lesson 0
        session: S2
      - number: 2
        lesson: imu_sensor             # Lesson 4
        session: S2
      - number: 3
        lesson: motor_control          # Lesson 1
        session: S3
      - number: 4
        lesson: controller_input       # Lesson 2
        session: S3
      - number: 5
        lesson: rate_p_control         # Lesson 5
        session: S4
      - number: 6
        lesson: system_modeling        # Lesson 6
        session: S4
      - number: 7
        lesson: system_identification  # Lesson 7
        session: S4
      - number: 8
        lesson: pid_control            # Lesson 8
        session: S4
      - number: 9
        lesson: attitude_estimation    # Lesson 9
        session: S4
