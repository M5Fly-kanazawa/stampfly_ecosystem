<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 882" width="1400" height="882" role="img" aria-label="送信機（Atom JoyStick）のイラスト">
  <style>
    .ol{stroke:#1F2A44;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
    .wt{fill:#fff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;font-weight:800}
    .lcd{font-family:"Share Tech Mono","Courier New",monospace;font-size:19.6px;fill:#D9F25C;letter-spacing:0}
  </style>
  <defs>
    <linearGradient id="ci-plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4262"/><stop offset="1" stop-color="#2A3150"/></linearGradient>
    <linearGradient id="ci-bat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F4F9"/><stop offset="1" stop-color="#C8D0DE"/></linearGradient>
  </defs>

  <!-- yellow buttons (behind the plate) -->
  <g class="ol">
    <path d="M395 103V124H461V103Z" fill="#FFC93C"/>
    <ellipse cx="428" cy="103" rx="33" ry="15" fill="#FFE07A"/>
    <path d="M865 103V124H931V103Z" fill="#FFC93C"/>
    <ellipse cx="898" cy="103" rx="33" ry="15" fill="#FFE07A"/>
  </g>

  <!-- PCB behind the sticks -->
  <rect class="ol" x="140" y="455" width="1125" height="290" rx="40" fill="#1A2036"/>

  <!-- main plate -->
  <path class="ol" d="M300 124H1085L1160 220V434V472H190V240Z" fill="url(#ci-plate)"/>
  <path d="M312 138H1078" stroke="#5A6590" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- battery cavity -->
  <rect class="ol" x="350" y="238" width="816" height="206" rx="14" fill="#10142A"/>
  <!-- terminals -->
  <rect class="ol" x="358" y="246" width="100" height="78" rx="8" fill="#0A0D1C"/>
  <rect class="ol" x="358" y="352" width="100" height="78" rx="8" fill="#0A0D1C"/>
  <path d="M370 258H446M370 364H446" stroke="#3A4262" stroke-width="4" stroke-linecap="round"/>
  <!-- batteries -->
  <rect class="ol" x="452" y="249" width="726" height="78" rx="30" fill="url(#ci-bat)"/>
  <rect class="ol" x="456" y="341" width="714" height="80" rx="30" fill="url(#ci-bat)"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M490 270H1130"/><path d="M490 362H1125"/>
  </g>
  <g stroke="#9AA4B8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M490 296H1135"/><path d="M490 392H1130"/>
  </g>
  <!-- battery numbers -->
  <g fill="none" stroke="#fff" stroke-width="3.5"><circle cx="325" cy="283" r="15"/><circle cx="322" cy="383" r="15"/></g>
  <text class="wt" x="325" y="290" text-anchor="middle" style="font-size:20px">1</text>
  <text class="wt" x="322" y="390" text-anchor="middle" style="font-size:20px">2</text>

  <!-- screws -->
  <g class="ol" style="stroke-width:4.5">
    <circle cx="330" cy="184" r="20" fill="#D5DAE6"/><circle cx="1010" cy="184" r="20" fill="#D5DAE6"/>
    <circle cx="218" cy="467" r="20" fill="#D5DAE6"/><circle cx="1130" cy="467" r="20" fill="#D5DAE6"/>
  </g>
  <g fill="#6E7794">
    <circle cx="330" cy="184" r="8"/><circle cx="1010" cy="184" r="8"/><circle cx="218" cy="467" r="8"/><circle cx="1130" cy="467" r="8"/>
  </g>

  <!-- labels on plate -->
  <text class="wt" x="426" y="158" text-anchor="middle" style="font-size:28px">L</text>
  <text class="wt" x="928" y="160" text-anchor="middle" style="font-size:28px">R</text>
  <text class="wt" x="563" y="207" textLength="232" lengthAdjust="spacingAndGlyphs" style="font-size:36px">Atom JoyStick</text>
  <!-- power switch -->
  <text class="wt" x="632" y="145" text-anchor="middle" style="font-size:15px">OFF</text>
  <rect x="661" y="130" width="36" height="19" rx="9.5" fill="#fff" stroke="#1F2A44" stroke-width="3"/>
  <circle cx="687" cy="139.5" r="6" fill="#1F2A44"/>
  <text class="wt" x="722" y="145" text-anchor="middle" style="font-size:15px">ON</text>

  <!-- LCD unit -->
  <rect class="ol" x="515" y="455" width="323" height="323" rx="38" fill="#FFFDF5"/>
  <rect x="568" y="507" width="217" height="216" rx="6" fill="#05070C" stroke="#1F2A44" stroke-width="5"/>
  <g class="lcd">
    <text x="578" y="534">MAC ADR A7:1C</text>
    <text x="578" y="560">BAT 1: 4.0 2: 4.0</text>
    <text x="578" y="586">MODE: 3</text>
    <text x="578" y="613">CH: 04 ID: 0</text>
    <text x="578" y="639">-Auto ALT-</text>
    <text x="578" y="666">-STABILIZE-</text>
    <text x="578" y="694">Freq:&#160; 49 M</text>
  </g>

  <!-- LEFT stick: pink (left half) / sky (right half) ring -->
  <g transform="translate(0,3)">
    <path d="M292 470A180 180 0 0 0 292 830" fill="none" stroke="#FF6F91" stroke-width="14"/>
    <path d="M292 470A180 180 0 0 1 292 830" fill="none" stroke="#29B6F6" stroke-width="14"/>
    <circle class="ol" cx="292" cy="650" r="166" fill="#262D48"/>
    <circle class="ol" cx="284" cy="660" r="134" fill="#343C5C"/>
    <circle class="ol" cx="275" cy="668" r="104" fill="#46506F"/>
    <path d="M205 625A90 90 0 0 1 270 590" fill="none" stroke="#8892B2" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- RIGHT stick: mint (left half) / orange (right half) ring + red push ring -->
  <g transform="translate(0,-3)">
    <path d="M1085 483A185 185 0 0 0 1085 853" fill="none" stroke="#2EC4A0" stroke-width="14"/>
    <path d="M1085 483A185 185 0 0 1 1085 853" fill="none" stroke="#FF9F43" stroke-width="14"/>
    <circle class="ol" cx="1085" cy="668" r="171" fill="#262D48"/>
    <circle class="ol" cx="1096" cy="688" r="136" fill="#343C5C"/>
    <circle class="ol" cx="1108" cy="700" r="106" fill="#46506F"/>
    <path d="M1038 658A90 90 0 0 1 1100 612" fill="none" stroke="#8892B2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1108" cy="700" r="84" fill="none" stroke="#E53950" stroke-width="7"/>
  </g>
</svg>
