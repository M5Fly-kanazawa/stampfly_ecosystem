<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>StampFly アンケートポスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--sky:#29B6F6;--purple:#7C6CF2;--pink:#FF6F91;--yellow:#FFC93C;--mint:#2EC4A0;--orange:#FF9F43;--ink:#1F2A44}
html,body{width:210mm;height:297mm;background:#FFF9EC}
body{word-break:auto-phrase;line-break:strict;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:210mm;height:297mm;overflow:hidden;background:#FFF9EC}
.abs{position:absolute}
.deco{position:absolute;border-radius:50%}

/* header band */
.hero{position:absolute;left:0;top:0;width:210mm;height:66mm;background:linear-gradient(120deg,#29B6F6 0%,#7C6CF2 60%,#FF6F91 120%)}
.band{position:absolute;left:14mm;top:10mm;background:var(--yellow);font-weight:800;font-size:13pt;padding:1.2mm 5mm;border-radius:6mm}
.title{position:absolute;left:14mm;top:22mm;color:#fff;font-weight:800;font-size:34pt;line-height:1.18;text-shadow:0 1mm 0 rgba(31,42,68,.35);white-space:nowrap}
.hero-img{position:absolute;left:128mm;top:2mm;width:80mm;transform:rotate(-6deg)}

/* QR card */
.card{position:absolute;left:35mm;top:80mm;width:140mm;height:156mm;background:#fff;border-radius:9mm;border:1.6mm solid var(--purple);box-shadow:0 1.6mm 0 rgba(124,108,242,.25)}
.card .ask{position:absolute;left:0;top:7mm;width:100%;text-align:center;font-weight:800;font-size:17pt}
.card .ask b{color:#D6285A}
.qr{position:absolute;left:12mm;top:20mm;width:116mm;height:116mm;image-rendering:pixelated}
.card .scan{position:absolute;left:0;top:137mm;width:100%;text-align:center;font-weight:800;font-size:12pt}
.card .url{position:absolute;left:0;top:145mm;width:100%;text-align:center;font-weight:700;font-size:10pt;color:#5A6378;letter-spacing:.2mm}

/* badges */
.badges{position:absolute;left:20mm;top:243mm;width:170mm;display:flex;justify-content:center;gap:7mm}
.bd{width:32mm;height:15mm;border-radius:7.5mm;color:#fff;font-weight:800;font-size:14pt;display:flex;align-items:center;justify-content:center;box-shadow:0 .8mm 0 rgba(31,42,68,.18)}

.note{position:absolute;left:22mm;top:263mm;width:166mm;text-align:center;font-weight:700;font-size:10pt;line-height:1.5}
.note b{color:#4A3CC0}

.foot{position:absolute;left:0;top:286mm;width:210mm;height:11mm;background:var(--ink);color:#fff;font-size:9pt;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body><div class="page">

<!-- page decorations -->
<div class="deco" style="left:-10mm;top:150mm;width:26mm;height:26mm;background:#FFE3EA"></div>
<div class="deco" style="right:-9mm;top:105mm;width:22mm;height:22mm;background:#DDF3FD"></div>
<div class="deco" style="left:12mm;top:96mm;width:5mm;height:5mm;background:var(--yellow)"></div>
<div class="deco" style="right:14mm;top:215mm;width:6mm;height:6mm;background:var(--mint)"></div>
<div class="deco" style="left:20mm;top:226mm;width:3.5mm;height:3.5mm;background:var(--orange)"></div>
<div class="deco" style="right:22mm;top:84mm;width:3.5mm;height:3.5mm;background:var(--pink)"></div>

<div class="hero">
  <div class="deco" style="left:100mm;top:-8mm;width:30mm;height:30mm;background:rgba(255,255,255,.16)"></div>
  <div class="deco" style="left:-8mm;top:44mm;width:28mm;height:28mm;background:rgba(255,255,255,.14)"></div>
  <div class="deco" style="left:112mm;top:48mm;width:6mm;height:6mm;background:#FFC93C"></div>
  <div class="deco" style="left:120mm;top:12mm;width:3.5mm;height:3.5mm;background:#FFC93C"></div>
  <div class="deco" style="left:106mm;top:32mm;width:3mm;height:3mm;background:#2EC4A0"></div>
</div>
<svg class="abs" style="left:0;top:58mm" width="210mm" height="12mm" viewBox="0 0 210 12" preserveAspectRatio="none"><path d="M0 0H210V5C192 12 175 12 157 6S122 -1 105 5 70 12 52 6 18 0 0 6Z" fill="#FF6F91"/></svg>
<div class="band">StampFly 操縦体験会</div>
<div class="title">アンケートに<br>ご協力ください！</div>
<img class="hero-img" src="images/drone_hero.png" alt="StampFly">

<div class="card">
  <div class="ask">飛ばしてみた<b>感想</b>を聞かせてください</div>
  <img class="qr" src="../_shared/images/qr_survey_flight.png" alt="アンケートの QR コード">
  <div class="scan">スマホのカメラで読み取ってください</div>
  <div class="url">forms.gle/GuBCsVVrbB8W71Sd7</div>
</div>

<div class="badges">
  <div class="bd" style="background:var(--pink)">約 3 分</div>
  <div class="bd" style="background:var(--sky)">無記名</div>
  <div class="bd" style="background:var(--mint)">スマホで OK</div>
</div>

<div class="note">いただいた回答は、体験会と教材をよくするために使います。<br><b>集中講義（2027 年 3 月 1 日〜5 日）</b>や次回の体験会の案内がほしい人は、<br>最後にメールアドレスを書いてください（任意）。</div>

<div class="foot">StampFly は M5Stack と伊藤研究室で開発された教育用ドローンです</div>

</div></body></html>
